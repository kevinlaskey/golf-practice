<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#f8faf8"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="SGGrind"/>
<title>Short Game Grind</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  /*
   * Modern Minimal — Augusta palette
   * --bg:           #f8faf8   near-white with green tint
   * --surface:      #ffffff
   * --green:        #155c35   Masters green
   * --green-mid:    #1e7a48
   * --green-light:  #e8f4ed
   * --gold:         #c9a84c   Augusta gold
   * --gold-light:   #fdf6e3
   * --text:         #111827   near-black
   * --text-mid:     #4b5563
   * --text-faint:   #9ca3af
   * --border:       #e5e7eb
   * --red:          #dc2626
   * --red-light:    #fef2f2
   */

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body {
    background: #f8faf8;
    color: #111827;
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100svh;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  button:active { opacity: 0.75; transform: scale(0.98); }
  .serif { font-family: 'Inter', sans-serif; font-weight: 800; }

  #app { max-width: 480px; margin: 0 auto; padding: 0 16px 88px; }

  /* ── Nav — white bar, indicator dot on active ── */
  #nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #ffffff; border-top: 1px solid #e5e7eb;
    display: flex; z-index: 50;
  }
  #nav button {
    flex: 1; background: transparent; border: none; border-top: 2px solid transparent;
    color: #9ca3af; font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 500;
    padding: 10px 2px 12px; cursor: pointer; letter-spacing: .04em; text-transform: uppercase;
    transition: color .15s; display: flex; flex-direction: column; align-items: center; gap: 3px;
    margin-top: -1px;
  }
  #nav button::before {
    content: ''; display: block; width: 4px; height: 4px; border-radius: 50%;
    background: transparent; transition: background .15s; margin-bottom: 1px;
  }
  #nav button.active { color: #155c35; }
  #nav button.active::before { background: #155c35; }

  /* ── Cards ── */
  .card {
    background: #ffffff; border: 1px solid #e5e7eb;
    border-radius: 16px; padding: 16px; margin-bottom: 10px;
  }
  .card.clickable { cursor: pointer; transition: border-color .15s, transform .1s; }
  .card.clickable:hover { border-color: #155c35; transform: translateY(-1px); }
  .card.clickable:active { transform: translateY(0); }

  /* ── Hero card — the signature Modern Minimal element ── */
  .hero-card {
    background: #155c35; border-radius: 20px; padding: 20px;
    margin-bottom: 14px; position: relative; overflow: hidden;
  }
  .hero-card::before {
    content: ''; position: absolute; top: -32px; right: -32px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(201,168,76,.12);
  }
  .hero-card::after {
    content: ''; position: absolute; bottom: -48px; left: -24px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,.04);
  }
  .hero-label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,.55); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .hero-score { font-size: 52px; font-weight: 800; color: #c9a84c; line-height: 1; }
  .hero-of { font-size: 18px; font-weight: 500; color: rgba(255,255,255,.35); }
  .hero-sub { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 6px; }
  .hero-grade {
    position: absolute; top: 20px; right: 20px;
    background: rgba(201,168,76,.2); border: 1px solid rgba(201,168,76,.4);
    color: #c9a84c; font-size: 11px; font-weight: 600; padding: 4px 10px;
    border-radius: 20px; letter-spacing: .04em;
  }

  /* ── Section label ── */
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: #9ca3af; margin-bottom: 10px;
  }

  /* ── Badge (timer etc) ── */
  .badge {
    background: #fdf6e3; border: 1px solid rgba(201,168,76,.4);
    border-radius: 20px; padding: 4px 12px; font-size: 11px; color: #c9a84c;
    font-weight: 600; white-space: nowrap;
  }

  /* ── Tip ── */
  .tip {
    background: #e8f4ed; border-radius: 12px; padding: 12px 14px;
    font-size: 12px; color: #155c35; line-height: 1.65; margin-top: 12px;
    font-weight: 500;
  }

  /* ── Pill stat boxes (chip/pitch/flop) ── */
  .pill-stat-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .pill-stat {
    flex: 1; border-radius: 14px; padding: 12px 8px; text-align: center;
  }
  .pill-stat-val { font-size: 22px; font-weight: 800; line-height: 1; }
  .pill-stat-lbl { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; opacity: .7; }
  .pill-green { background: #e8f4ed; }
  .pill-green .pill-stat-val { color: #155c35; }
  .pill-green .pill-stat-lbl { color: #155c35; }
  .pill-gold  { background: #fdf6e3; }
  .pill-gold  .pill-stat-val { color: #c9a84c; }
  .pill-gold  .pill-stat-lbl { color: #c9a84c; }
  .pill-red   { background: #fef2f2; }
  .pill-red   .pill-stat-val { color: #dc2626; }
  .pill-red   .pill-stat-lbl { color: #dc2626; }

  /* ── Buttons ── */
  .btn {
    background: #155c35; color: #ffffff; border: none; border-radius: 12px;
    padding: 15px 22px; font-size: 14px; font-weight: 700;
    font-family: 'Inter', sans-serif; cursor: pointer;
    letter-spacing: .02em; width: 100%; margin-top: 14px;
    transition: background .15s;
  }
  .btn:hover { background: #1e7a48; }
  .btn-green { background: #1e7a48; }
  .btn-ghost {
    background: #ffffff; color: #4b5563; border: 1px solid #e5e7eb;
    border-radius: 12px; padding: 12px 16px; font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: 'Inter', sans-serif;
    transition: border-color .15s, background .15s;
  }
  .btn-ghost:hover { border-color: #155c35; background: #f8faf8; }
  .btn-danger { color: #dc2626; border-color: rgba(220,38,38,.3); background: #fef2f2; }
  .btn-muted { border: none; font-size: 12px; color: #9ca3af; background: transparent; }

  /* ── Inputs ── */
  .inp {
    background: #f9fafb; border: 1.5px solid #e5e7eb;
    border-radius: 10px; padding: 11px 14px; font-size: 16px;
    color: #111827; font-family: 'Inter', sans-serif; width: 100%;
    transition: border-color .15s, background .15s;
  }
  .inp:focus { outline: none; border-color: #155c35; background: #ffffff; }
  textarea.inp { resize: none; }

  .counter-btn {
    background: #f3f4f6; border: 1.5px solid #e5e7eb;
    border-radius: 12px; width: 52px; height: 52px; font-size: 26px; font-weight: 300;
    color: #155c35; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-family: 'Inter', sans-serif;
    transition: background .15s;
  }
  .counter-btn:hover { background: #e8f4ed; border-color: #155c35; }

  /* ── Space badges ── */
  .space-badge {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 8px; padding: 3px 9px; font-size: 10px; white-space: nowrap;
    letter-spacing: .02em; font-weight: 600;
  }
  .space-full  { background: #fef2f2; border: 1px solid rgba(220,38,38,.3);  color: #dc2626; }
  .space-edge  { background: #fdf6e3; border: 1px solid rgba(201,168,76,.4); color: #c9a84c; }
  .space-solo  { background: #e8f4ed; border: 1px solid rgba(21,92,53,.25);  color: #155c35; }

  /* ── Club buttons ── */
  .club-btn { padding: 7px 14px; font-size: 12px; font-weight: 500; border-radius: 8px; }
  .club-btn.selected { background: #e8f4ed; color: #155c35; border-color: #155c35; font-weight: 600; }

  /* ── Progress dots ── */
  .dot { height: 6px; border-radius: 3px; background: #e5e7eb; transition: all .25s; }
  .dot.done   { background: #155c35; }
  .dot.active { background: #1e7a48; }
  .dot.busy   { background: #fca5a5; }
  .dot.skip   { background: #e5e7eb; }

  /* ── Skip overlay ── */
  #skip-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 200; display: none; align-items: flex-end; justify-content: center;
  }
  #skip-overlay.open { display: flex; }
  #skip-sheet {
    background: #ffffff; border-top: 3px solid #155c35;
    border-radius: 20px 20px 0 0; padding: 24px 20px 44px;
    width: 100%; max-width: 480px;
  }
  .skip-option {
    border-radius: 12px; padding: 14px 16px; font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: 'Inter', sans-serif; text-align: left;
    line-height: 1.5; width: 100%; margin-bottom: 8px;
  }
  .skip-busy  { background: #fef2f2; border: 1px solid rgba(220,38,38,.3); color: #dc2626; }
  .skip-today { background: #f9fafb; border: 1px solid #e5e7eb; color: #4b5563; }

  /* ── Stat tiles ── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .stat-tile {
    background: #ffffff; border: 1px solid #e5e7eb;
    border-radius: 14px; padding: 14px 16px;
  }
  .stat-label { font-size: 10px; color: #9ca3af; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
  .stat-value { font-size: 24px; font-weight: 800; color: #155c35; }

  /* ── Chart ── */
  .chart-wrap {
    background: #ffffff; border: 1px solid #e5e7eb;
    border-radius: 14px; padding: 14px; margin-bottom: 10px;
  }
  .chart-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .chart-label { font-size: 11px; color: #9ca3af; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .chart-trend { font-size: 11px; font-weight: 700; }
  .chart-footer { display: flex; justify-content: space-between; font-size: 10px; color: #d1d5db; margin-top: 4px; }

  /* ── Toast / IO ── */
  .io-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .io-row .btn-ghost { flex: 1; font-size: 12px; }
  .toast { border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 14px; display: none; font-weight: 500; }
  .toast.show { display: block; }
  .toast.ok  { background: #e8f4ed; color: #155c35; }
  .toast.err { background: #fef2f2; color: #dc2626; }

  /* ── Page header ── */
  .page-header { padding: 28px 0 18px; border-bottom: 1px solid #e5e7eb; margin-bottom: 20px; }
  .page-title { font-size: 28px; font-weight: 800; color: #111827; }
  .page-sub { font-size: 13px; color: #9ca3af; margin-top: 3px; font-weight: 400; }

  /* ── Session header ── */
  .session-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 14px; }

  /* ── Flex helpers ── */
  .row { display: flex; align-items: center; }
  .row-between { display: flex; align-items: flex-start; justify-content: space-between; }
  .gap-7 { gap: 7px; }
  .gap-8 { gap: 8px; }
  .gap-16 { gap: 16px; }
  .wrap { flex-wrap: wrap; }
  .flex-1 { flex: 1; }
  .flex-2 { flex: 2; }
  .mt-0 { margin-top: 0; }
  .center { text-align: center; }

  /* ── Score buttons (1/2/3) ── */
  .score-btns { display: flex; gap: 8px; }
  .score-btn {
    flex: 1; height: 56px; border-radius: 12px; font-size: 24px; font-weight: 800;
    font-family: 'Inter', sans-serif; border: 2px solid #e5e7eb;
    background: #f9fafb; color: #d1d5db; cursor: pointer; transition: all .12s;
  }
  .score-btn:hover { border-color: #155c35; color: #155c35; background: #f0faf4; }
  .score-btn.sel-1 { background: #fdf6e3; border-color: #c9a84c; color: #c9a84c; }
  .score-btn.sel-2 { background: #fce7e0; border-color: #dc8b68; color: #dc8b68; }
  .score-btn.sel-3 { background: #e8f4ed; border-color: #155c35; color: #155c35; }

  /* ── Ladder 0/1 buttons ── */
  .ladder-btn {
    flex: 1; height: 52px; border-radius: 12px; font-size: 18px; font-weight: 700;
    font-family: 'Inter', sans-serif; border: 2px solid #e5e7eb;
    background: #f9fafb; color: #d1d5db; cursor: pointer; transition: all .12s;
  }
  .ladder-btn:hover { border-color: #155c35; color: #155c35; background: #f0faf4; }
  .ladder-btn.sel-0 { background: #fef2f2; border-color: #dc2626; color: #dc2626; }
  .ladder-btn.sel-1 { background: #e8f4ed; border-color: #155c35; color: #155c35; }

  /* ── Hole row ── */
  .hole-row {
    background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px;
    padding: 13px 14px; margin-bottom: 8px;
  }
  .hole-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: #155c35; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .shot-type-pill {
    font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 20px;
  }
  .pill-chip  { background: #e8f4ed; color: #155c35; }
  .pill-pitch { background: #fdf6e3; color: #c9a84c; }
  .pill-flop  { background: #fef2f2; color: #dc2626; }

  /* ── Score ring (game done) ── */
  .score-ring {
    width: 88px; height: 88px; border-radius: 50%;
    background: #155c35; display: flex; flex-direction: column;
    align-items: center; justify-content: center; margin: 0 auto 6px;
  }
  .score-ring-val { font-size: 32px; font-weight: 800; color: #c9a84c; line-height: 1; }
  .score-ring-max { font-size: 11px; color: rgba(255,255,255,.5); font-weight: 500; }

  /* ── Ladder row ── */
  .ladder-row {
    background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 7px;
    display: flex; align-items: center; gap: 12px;
  }
  .ladder-shot-num {
    width: 26px; height: 26px; border-radius: 50%;
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ladder-shot-num.club-8i { background: #e8f4ed; color: #155c35; }
  .ladder-shot-num.club-52 { background: #fdf6e3; color: #c9a84c; }

  /* ── Game type badge ── */
  .game-type-badge {
    font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 20px; letter-spacing: .04em;
  }
  .gtb-nine   { background: #e8f4ed; color: #155c35; }
  .gtb-ladder { background: #fdf6e3; color: #c9a84c; }

  /* ── Practice card ── */
  .practice-card {
    background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px;
    padding: 16px; margin-bottom: 10px;
  }
  .practice-tag {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    padding: 3px 9px; border-radius: 20px; display: inline-block; margin-bottom: 8px;
  }
  .ptag-putting  { background: #e8f4ed; color: #155c35; }
  .ptag-chipping { background: #fdf6e3; color: #c9a84c; }
  .ptag-pitching { background: #fef2f2; color: #dc2626; }
  .ptag-bunker   { background: #f0eef8; color: #6b5ea8; }
  .ptag-mental   { background: #eff6ff; color: #2563eb; }
</style>
</head>
<body>

<div id="app"></div>

<div id="nav">
  <button id="nav-games"    onclick="goTab('games')"   >Games</button>
  <button id="nav-drills"   onclick="goTab('drills')"  >Drills</button>
  <button id="nav-practice" onclick="goTab('practice')">Practice</button>
  <button id="nav-history"  onclick="goTab('history')" >History</button>
</div>

<!-- Skip overlay (for session drills) -->
<div id="skip-overlay" onclick="closeSkip()">
  <div id="skip-sheet" onclick="event.stopPropagation()">
    <div class="serif" style="font-size:19px;color:#111827;margin-bottom:4px">Skip this drill?</div>
    <div id="skip-drill-name" style="font-size:12px;color:#9ca3af;margin-bottom:18px"></div>
    <button class="skip-option skip-busy" onclick="doSkip('busy')">
      🚶 <strong>Green is busy</strong><br>
      <span style="font-size:11px;opacity:.8">Other people on the green, can't do this right now</span>
    </button>
    <button class="skip-option skip-today" onclick="doSkip('skipped')">
      ⏭ <strong>Skip for today</strong><br>
      <span style="font-size:11px;opacity:.8">Running short on time, not feeling it, etc.</span>
    </button>
    <button class="btn-ghost btn-muted" style="width:100%;margin-top:4px" onclick="closeSkip()">← Go back to drill</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// GAME DATA
// ─────────────────────────────────────────────────────────────────────────────

// 9-Hole game: 3 chip & run, 3 pitch, 3 flop — arranged in alternating order
const NINE_HOLES = [
  {
    hole: 1,
    scenarios: [
      { desc: '20–30 yd pitch on tight lie, must clear the hill to reach the green', pts: [1, 2, 3], labels: ['Hill blocked','On green','Landing area'] },
      { desc: 'Side chip with 8-iron from right side of green', pts: [1, 2, 3], labels: ['Short','Close','Tap-in'] },
      { desc: 'Back edge downhill chip', pts: [1, 2, 3], labels: ['Short','Close','Tap-in'] },
    ],
  },
  {
    hole: 2,
    scenarios: [
      { desc: 'Chip to close pin from tight lie', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
      { desc: 'Chip to back pin from tight lie', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
      { desc: 'Shot went over green — short chip back from slight rough to close pin', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
    ],
  },
  {
    hole: 3,
    scenarios: [
      { desc: 'Left short left — 20–30 yd pitch on tight lie, must clear the rough to land on green', pts: [1, 2, 3], labels: ['Cleared rough','On green','Perfect spot'] },
      { desc: 'Left short right — short pitch from tight lie to front pin', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
    ],
  },
  {
    hole: 4,
    scenarios: [
      { desc: 'Pitch shot from tight lie — any distance', pts: [1, 2, 3], labels: ['On green','Good contact','Perfect'] },
      { desc: 'Chip shot from tight lie — any distance', pts: [1, 2, 3], labels: ['On green','Good contact','Perfect'] },
      { desc: 'Shot from rough — pitch or chip', pts: [1, 2, 3], labels: ['On green','Good contact','Perfect'] },
    ],
  },
  {
    hole: 5,
    scenarios: [
      { desc: 'Pitch shot from tight lie — any distance', pts: [1, 2, 3], labels: ['On green','Good contact','Perfect'] },
      { desc: 'Chip shot from tight lie — any distance', pts: [1, 2, 3], labels: ['On green','Good contact','Perfect'] },
      { desc: 'Shot from rough — pitch or chip', pts: [1, 2, 3], labels: ['On green','Good contact','Perfect'] },
    ],
  },
  {
    hole: 6,
    scenarios: [
      { desc: 'Pitch or chip from tight lie', pts: [1, 2, 3], labels: ['On green','Good contact','Perfect'] },
      { desc: 'Short pitch from rough', pts: [1, 2, 3], labels: ['On green','Good contact','Perfect'] },
    ],
  },
  {
    hole: 7,
    scenarios: [
      { desc: 'Tight lie pitch/chip to short cup', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
      { desc: 'Tight lie pitch/chip to back cup', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
    ],
  },
  {
    hole: 8,
    scenarios: [
      { desc: 'Tight lie pitch/chip to short cup', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
      { desc: 'Tight lie pitch/chip to back cup', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
    ],
  },
  {
    hole: 9,
    scenarios: [
      { desc: 'Tight lie pitch or flop to short pin', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
      { desc: 'Tight lie pitch or flop to deep pin', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
      { desc: 'Downhill chip to short pin', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
      { desc: 'Downhill chip to deep pin', pts: [1, 2, 3], labels: ['On green','Close','Tap-in'] },
    ],
  },
];

// Initialize current hole scenarios at app start
let currentHoleScenarios = {};
function initializeHoleScenarios() {
  NINE_HOLES.forEach((h, i) => {
    if (h.scenarios.length > 0) {
      const randomIdx = Math.floor(Math.random() * h.scenarios.length);
      currentHoleScenarios[i] = randomIdx;
    }

const STORAGE_KEY    = 'sg_sessions_v3';
const GAME_STORE_KEY = 'sg_games_v1';

function loadSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
function saveSessions(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
}
function loadGames() {
  try { return JSON.parse(localStorage.getItem(GAME_STORE_KEY) || '[]'); } catch { return []; }
}
function saveGames(g) {
  try { localStorage.setItem(GAME_STORE_KEY, JSON.stringify(g)); } catch(e) {}
}

let sessions = loadSessions();
let games    = loadGames();

function addSession(s) { s.id = crypto.randomUUID(); sessions.push(s); saveSessions(sessions); }
function addGame(g)    { g.id = crypto.randomUUID(); games.push(g);    saveGames(games); }

function exportData() {
  const payload = {
    app:'short-game-grind', version:'2.0',
    exported: new Date().toISOString(),
    sessions, games
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `sggrind-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const p = JSON.parse(e.target.result);
        let added = 0;
        if (Array.isArray(p.sessions)) {
          const ids = new Set(sessions.map(s => s.id).filter(Boolean));
          const newS = p.sessions.filter(s => !s.id || !ids.has(s.id));
          sessions = [...sessions, ...newS].sort((a,b) => new Date(a.date)-new Date(b.date));
          saveSessions(sessions); added += newS.length;
        }
        if (Array.isArray(p.games)) {
          const ids = new Set(games.map(g => g.id).filter(Boolean));
          const newG = p.games.filter(g => !g.id || !ids.has(g.id));
          games = [...games, ...newG].sort((a,b) => new Date(a.date)-new Date(b.date));
          saveGames(games); added += newG.length;
        }
        resolve(added);
      } catch(err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('File read failed'));
    reader.readAsText(file);
  });
}

function advanceDrill() {
  if (state.currentIdx < state.activeDrills.length - 1) { state.currentIdx++; renderSession(); }
  else finishSession();
}

function openSkip() {
  const drill = state.activeDrills[state.currentIdx];
  document.getElementById('skip-drill-name').innerHTML =
    `<strong style="color:#155c35">${drill.name}</strong> — tell us why so it logs correctly`;
  document.getElementById('skip-overlay').classList.add('open');
}
function closeSkip() { document.getElementById('skip-overlay').classList.remove('open'); }
function doSkip(reason) { state.skipped[state.currentIdx] = reason; closeSkip(); advanceDrill(); }

function finishSession() {
  stopTimer();
  const highlights = [], metrics = {};
  let skCount = 0;
  state.activeDrills.forEach((drill, i) => {
    if (state.skipped[i]) { skCount++; return; }
    const data = state.drillData[i] || {};
    const val = v => data[v];
    if (drill.id==='updown'       && val('up_downs')!==undefined) { highlights.push(`${val('up_downs')}/5 up-downs`);           metrics.up_downs=Number(val('up_downs')); }
    if (drill.id==='matrix'       && val('proximity'))             { highlights.push(`${val('proximity')}ft proximity`);         metrics.proximity=val('proximity'); }
    if (drill.id==='clock'        && val('clock_dist'))            { highlights.push(`${val('clock_dist')}ft clock`);            metrics.clock_dist=val('clock_dist'); }
    if (drill.id==='backswing'    && val('backswing_10'))          { highlights.push(`Backswing 10": ${val('backswing_10')}ft`); }
    if (drill.id==='landing_spot' && val('landing_hits')!==undefined){ highlights.push(`${val('landing_hits')}/10 landing spot`); metrics.landing_hits=Number(val('landing_hits')); }
    if (drill.id==='ladder'       && val('ladder_score'))          { highlights.push(`Ladder: ${val('ladder_score')} pts`);      metrics.ladder_score=val('ladder_score'); }
    if (drill.id==='one_club'     && val('one_club_ud')!==undefined){ highlights.push(`${val('one_club_ud')}/5 one-club`); }
    if (drill.id==='bump_run_race'&& val('bump_close')!==undefined) { highlights.push(`${val('bump_close')}/5 bump & run`); }
    if (drill.id==='worst_lie'    && val('worst_ud')!==undefined)  { highlights.push(`${val('worst_ud')}/5 bad lies`); }
    if (drill.id==='three_ball'   && val('three_ball_ring'))       { highlights.push(`3-ball: ${val('three_ball_ring')}ft ring`); metrics.three_ball_ring=val('three_ball_ring'); }
    if (drill.id==='fringe_chip'  && val('fringe_close')!==undefined){ highlights.push(`${val('fringe_close')}/10 fringe`); }
  });
  const busyCount = Object.values(state.skipped).filter(r=>r==='busy').length;
  if (busyCount>0) highlights.push(`${busyCount} skipped — busy green`);
  if (!highlights.length) highlights.push('Session logged');
  const session = {
    date: new Date().toISOString(), planName: state.activePlan.name,
    drillCount: state.activeDrills.length - skCount, skipped: skCount,
    highlights, metrics, duration: Math.round(state.timerSecs/60),
  };
  addSession(session);
  state.lastSession = session;
  state.screen = 'done';
  render();
}

function abandonSession() { stopTimer(); state.screen='browse'; state.tab='plans'; render(); }

function adjustCounter(idx, metric, delta, max) {
  const cur = state.drillData[idx]?.[metric] ?? 0;
  const next = Math.max(0, Math.min(max, cur+delta));
  setDrillVal(idx, metric, next);
  const el = document.getElementById('counter-display');
  if (el) el.textContent = next;
}

// ─────────────────────────────────────────────────────────────────────────────
// STATS
// ─────────────────────────────────────────────────────────────────────────────
function computeStats() {
  const ud    = sessions.map(s=>s.metrics?.up_downs).filter(v=>v!==undefined);
  const prox  = sessions.map(s=>Number(s.metrics?.proximity)).filter(n=>n>0&&!isNaN(n));
  const clock = sessions.map(s=>Number(s.metrics?.clock_dist)).filter(n=>n>0&&!isNaN(n));
  const nineGs  = games.filter(g=>g.type==='nine');
  const ladderGs= games.filter(g=>g.type==='ladder');
  return {
    total: sessions.length,
    totalMins: sessions.reduce((a,s)=>a+(s.duration||0),0),
    bestUD:    ud.length    ? Math.max(...ud)   : null,
    bestProx:  prox.length  ? Math.min(...prox) : null,
    avgUD:     ud.length    ? (ud.reduce((a,b)=>a+b,0)/ud.length).toFixed(1) : null,
    bestClock: clock.length ? Math.max(...clock): null,
    totalGames: games.length,
    bestNine:   nineGs.length   ? Math.max(...nineGs.map(g=>g.total))   : null,
    avgNine:    nineGs.length   ? (nineGs.reduce((a,g)=>a+g.total,0)/nineGs.length).toFixed(1) : null,
    bestLadder: ladderGs.length ? Math.max(...ladderGs.map(g=>g.total)) : null,
    avgLadder:  ladderGs.length ? (ladderGs.reduce((a,g)=>a+g.total,0)/ladderGs.length).toFixed(1) : null,
  };
}

function renderChart(data, label, lowerBetter) {
  // data = array of numbers (already extracted)
  const nums = data.filter(n => !isNaN(n) && n !== null);
  if (nums.length < 2) return '';
  const max = Math.max(...nums), min = Math.min(...nums), range = max-min||1;
  const W=260, H=52, P=8;
  const pts = nums.map((v,i) => {
    const x = P + (i/(nums.length-1))*(W-P*2);
    const y = H-P-((v-min)/range)*(H-P*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const circles = nums.map((v,i) => {
    const x = P + (i/(nums.length-1))*(W-P*2);
    const y = H-P-((v-min)/range)*(H-P*2);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#155c35"/>`;
  }).join('');
  const trend = nums[nums.length-1]-nums[0];
  const improving = lowerBetter ? trend<0 : trend>0;
  const trendColor = improving ? '#1e7a48' : trend===0 ? '#aabfb0' : '#dc2626';
  const trendLabel = improving ? '↑ Improving' : trend===0 ? '→ Steady' : '↓ Declining';
  return `
  <div class="chart-wrap">
    <div class="chart-header">
      <span class="chart-label">${label}</span>
      <span class="chart-trend" style="color:${trendColor}">${trendLabel}</span>
    </div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
      <polyline points="${pts}" fill="none" stroke="#155c35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${circles}
    </svg>
    <div class="chart-footer"><span>${nums[0]}</span><span style="color:#155c35">${nums[nums.length-1]}</span></div>
  </div>`;
}

        </div>
        <div class="pill-stat pill-gold">
          <div class="pill-stat-val">${g.by52}</div>
          <div class="pill-stat-lbl">52° /4</div>
          ${scoreBar(g.by52, 4, '#c9a84c')}
        </div>
      </div>`;

  const worstTip = isNine
    ? (() => {
        const t = [{k:'chip',v:g.byType.chip/6},{k:'pitch',v:g.byType.pitch/6},{k:'flop',v:g.byType.flop/6}].sort((a,b)=>a.v-b.v)[0].k;
        return {chip:'Chip & run was your weakest — focus on bumping the ball onto the green with the 8-iron, landing 2–3 ft on.',pitch:'Pitching needs work — practice clock-face distances: 7, 9, 11 o\'clock backswings with your 52°.',flop:'Flop shots were the challenge — try the Landing Spot Game to build feel for high, soft shots.'}[t];
      })()
    : g.by8i>g.by52 ? '8-iron was stronger. Your 52° needs work — focus on clean contact and consistent landing spot.'
    : g.by52>g.by8i ? '52° performed better. The 8-iron bump & run needs some pace calibration.'
    : 'Even split — solid consistency. Push the distances further next time.';

  const holeRows = isNine
    ? (g.scores||[]).map((h,i)=>`
      <div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:${i<g.scores.length-1?'1px solid #f3f4f6':'none'}">
        <div class="hole-num" style="flex-shrink:0">${h.hole}</div>
        <div style="flex:1;min-width:0">
          <div style="margin-bottom:3px"><span class="shot-type-pill ${h.pill}" style="font-size:9px">${h.label}</span></div>
          <div style="font-size:11px;color:#6b7280;line-height:1.4">${h.desc}</div>
        </div>
        ${scoreDot(h.score, 2)}
      </div>`).join('')
    : (() => {
        const shots8i = (g.shots||[]).filter(s=>s.club==='8i');
        const shots52 = (g.shots||[]).filter(s=>s.club==='52');
        return `
          <div style="font-size:11px;font-weight:700;color:#155c35;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">8-Iron</div>
          ${shots8i.map((s,i)=>`
            <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:${i<shots8i.length-1?'1px solid #f3f4f6':'1px solid #e5e7eb'}">
              <div class="ladder-shot-num club-8i" style="flex-shrink:0">${s.idx+1}</div>
              <div style="flex:1;font-size:11px;color:#6b7280;line-height:1.4">${s.desc}</div>
              ${scoreDot(s.score, 1)}
            </div>`).join('')}
          <div style="font-size:11px;font-weight:700;color:#c9a84c;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 8px">52° Wedge</div>
          ${shots52.map((s,i)=>`
            <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:${i<shots52.length-1?'1px solid #f3f4f6':'none'}">
              <div class="ladder-shot-num club-52" style="flex-shrink:0">${s.idx+1}</div>
              <div style="flex:1;font-size:11px;color:#6b7280;line-height:1.4">${s.desc}</div>
              ${scoreDot(s.score, 1)}
            </div>`).join('')}`;
      })();

  return `
  <button class="btn-ghost btn-muted" onclick="goTab('history')" style="margin-top:20px;padding:0;font-size:13px;font-weight:600">← History</button>

  <div class="hero-card" style="margin-top:14px">
    <div class="hero-label">${isNine?'9-Hole Game':'Club Ladder'} · ${fmtDate(g.date)}</div>
    <div class="hero-score">${g.total}<span class="hero-of"> /${g.maxPossible}</span></div>
    <div class="hero-sub">${pct}%</div>
    <div class="hero-grade">${grade}</div>
  </div>

  <div class="section-label" style="margin-top:20px">By shot type</div>
  ${pillsHTML}

  <div class="tip">💡 ${worstTip}</div>

  <div class="section-label" style="margin-top:20px">Shot by shot</div>
  <div class="card">
    ${holeRows}
  </div>

  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn-ghost flex-1" onclick="goTab('history')" style="margin-top:0">← History</button>
    <button class="btn flex-1" onclick="${isNine?'startNineHole()':'startLadder()'}" style="margin-top:0">Play Again</button>
  </div>`;
}

// RENDER — DRILLS
// ─────────────────────────────────────────────────────────────────────────────
function renderDrills() {
  const groups = { solo:[], edge:[], full:[] };
  DRILLS.forEach(d => groups[d.spaceNeeded].push(d));

  const sections = [
    { key:'solo', dark:'#0f2d1a', label_c:'#6ee7a0', text_c:'#d4eeda', icon:'✓', label:'Works anywhere', sub:'Single hole only' },
    { key:'edge', dark:'#2d2510', label_c:'#f0d070', text_c:'#f0e5c0', icon:'◐', label:'Edge of green',  sub:'Fringe access needed' },
    { key:'full', dark:'#2d1010', label_c:'#f8a0a0', text_c:'#f5d0d0', icon:'⚠', label:'Open green',     sub:'Full green needed' },
  ];

  return `
  <div style="padding:28px 0 20px">
    <div style="font-size:28px;font-weight:800;color:#111827">Drills</div>
    <div style="font-size:13px;color:#9ca3af;margin-top:2px">${DRILLS.length} drills · sorted by space needed</div>
  </div>

  ${sections.map(sec => `
    <div style="background:${sec.dark};border-radius:16px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <span style="color:${sec.label_c};font-size:18px;font-weight:800">${sec.icon}</span>
      </div>
      <div>
        <div style="font-size:15px;font-weight:700;color:${sec.label_c}">${sec.label}</div>
        <div style="font-size:11px;color:${sec.label_c};opacity:.6;margin-top:1px">${sec.sub} · ${groups[sec.key].length} drills</div>
      </div>
    </div>
    ${groups[sec.key].map(d => `
      <div style="background:${sec.dark};border-radius:16px;padding:16px;margin-bottom:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-size:15px;font-weight:700;color:${sec.label_c}">${d.name}</div>
          <span style="font-size:11px;font-weight:600;color:${sec.label_c};opacity:.7;background:rgba(255,255,255,.1);padding:3px 9px;border-radius:20px">${d.duration} min</span>
        </div>
        <div style="font-size:13px;color:${sec.text_c};line-height:1.65;margin-bottom:12px">${d.description}</div>
        <div style="background:rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;font-size:12px;color:${sec.label_c};line-height:1.55;font-weight:500">💡 ${d.tip}</div>
        <div style="font-size:11px;color:${sec.label_c};opacity:.5;margin-top:8px">Clubs: ${d.clubs.join(' · ')}</div>
      </div>`).join('')}
    <div style="height:6px"></div>
  `).join('')}`;
}

  <div class="section-label">Game scores</div>

        <div style="width:48px;height:48px;border-radius:50%;background:#155c35;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:18px;font-weight:800;color:#c9a84c;line-height:1">${g.total}</span>
          <span style="font-size:9px;color:rgba(255,255,255,.4)">/18</span>

        <div style="flex:1">

            <span style="font-size:11px;color:#155c35;font-weight:600">Chip ${g.byType.chip}/6</span>
            <span style="font-size:11px;color:#c9a84c;font-weight:600">Pitch ${g.byType.pitch}/6</span>
            <span style="font-size:11px;color:#dc2626;font-weight:600">Flop ${g.byType.flop}/6</span>
          </div>
        </div>

      </div>

  ${games.length===0&&sessions.length===0?`<div style="text-align:center;padding:60px 0;color:#9ca3af;font-size:14px">No history yet — play a game to get started!</div>`:''}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — SESSION (drill)
// ─────────────────────────────────────────────────────────────────────────────
function renderSession() {
  const drill = state.activeDrills[state.currentIdx];
  const idx = state.currentIdx;
  const total = state.activeDrills.length;

  const dots = state.activeDrills.map((_,i) => {
    const busy=state.skipped[i]==='busy', sk=state.skipped[i]==='skipped';
    const cur=i===idx, done=i<idx&&!state.skipped[i];
    const cls = busy?'dot busy':sk?'dot skip':done?'dot done':cur?'dot active':'dot';
    return `<div class="${cls}" style="width:${cur?22:7}px"></div>`;
  }).join('');

  const clubBtns = (drill.clubs||['52°','56°','60°','8i bump','Putter']).map(c => {
    const sel = state.clubSel[idx]===c;
    return `<button class="btn-ghost club-btn${sel?' selected':''}" onclick="selectClub(${idx},'${c.replace(/'/g,"\\'")}')">${c}</button>`;
  }).join('');

  let metricHTML;
  if (drill.metricType==='counter') {
    const val = state.drillData[idx]?.[drill.metric] ?? 0;
    metricHTML = `
      <div class="row gap-16" style="align-items:center">
        <button class="counter-btn" onclick="adjustCounter(${idx},'${drill.metric}',-1,${drill.metricMax||99})">−</button>
        <div id="counter-display" class="serif" style="font-size:48px;color:#155c35;min-width:42px;text-align:center;line-height:1">${val}</div>
        <button class="counter-btn" onclick="adjustCounter(${idx},'${drill.metric}',1,${drill.metricMax||99})">+</button>
        <div style="font-size:11px;color:#9ca3af">/ ${drill.metricMax}</div>
      </div>`;
  } else {
    const unit = drill.id==='ladder'?'pts':drill.id==='three_ball'?'ft ring':'ft';
    const val = state.drillData[idx]?.[drill.metric]||'';
    metricHTML = `
      <div class="row" style="gap:10px;align-items:center">
        <input class="inp" type="number" inputmode="decimal" placeholder="—" style="max-width:120px" value="${val}"
          oninput="setDrillVal(${idx},'${drill.metric}',this.value)"/>
        <div style="font-size:12px;color:#9ca3af">${unit}</div>
      </div>`;
  }

  const notesVal = (state.drillData[idx]?.notes||'').replace(/"/g,'&quot;');
  const backBtn = idx>0 ? `<button class="btn-ghost flex-1" onclick="state.currentIdx--;renderSession()">← Back</button>` : '';
  const skipBtn = `<button class="btn-ghost btn-danger flex-1" onclick="openSkip()">Skip</button>`;
  const nextBtn = idx<total-1
    ? `<button class="btn flex-2 mt-0" onclick="advanceDrill()">Next →</button>`
    : `<button class="btn btn-green flex-2 mt-0" onclick="finishSession()">Finish ✓</button>`;

  document.getElementById('app').innerHTML = `
  <div class="session-header">
    <div class="serif" style="font-size:22px;color:#111827">Session</div>
    <div class="badge" id="session-timer">${fmtTimer(state.timerSecs)}</div>
  </div>
  <div class="row" style="gap:5px;margin-bottom:18px;align-items:center">
    ${dots}
    <div style="font-size:10px;color:#9ca3af;margin-left:5px">${idx+1} / ${total}</div>
  </div>
  <div class="row-between" style="margin-bottom:8px">
    <div class="serif" style="font-size:20px;color:#111827;flex:1;margin-right:10px">${drill.name}</div>
    ${spaceBadgeHTML(drill, true)}
  </div>
  <div style="font-size:12px;color:#9ca3af;line-height:1.7;margin-bottom:16px">${drill.description}</div>
  <div style="margin-bottom:16px">
    <div class="section-label" style="margin-bottom:8px">Club Used</div>
    <div class="row wrap gap-7">${clubBtns}</div>
  </div>
  <div style="margin-bottom:6px">
    <div class="section-label" style="margin-bottom:10px">${drill.metricLabel}</div>
    ${metricHTML}
  </div>
  <textarea class="inp" rows="2" placeholder="Notes (optional)..." style="margin-top:12px;font-size:12px"
    oninput="setDrillVal(${idx},'notes',this.value)">${notesVal}</textarea>
  <div class="tip">💡 ${drill.tip}</div>
  <div class="row gap-8" style="margin-top:18px">${backBtn}${skipBtn}${nextBtn}</div>
  <div class="center" style="margin-top:13px">
    <button class="btn-ghost btn-muted" onclick="abandonSession()">Abandon session</button>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — DRILL DONE
// ─────────────────────────────────────────────────────────────────────────────
function renderDone() {
  const s = state.lastSession;
  return `
  <div style="padding:44px 0 22px;text-align:center">
    <div style="font-size:44px;margin-bottom:10px">⛳</div>
    <div class="serif" style="font-size:26px;color:#111827;margin-bottom:4px">Session Complete</div>
    <div style="font-size:12px;color:#9ca3af">${s.duration||'—'} min · ${s.drillCount} drills${s.skipped?` · ${s.skipped} skipped`:''}</div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="section-label">What you logged</div>
    ${s.highlights.map((h,i)=>`
      <div class="row" style="gap:9px;padding:7px 0;${i<s.highlights.length-1?'border-bottom:1px solid #f3f4f6':''}">
        <div style="width:5px;height:5px;border-radius:50%;background:#155c35;flex-shrink:0"></div>
        <div style="font-size:13px;color:#111827">${h}</div>
      </div>`).join('')}
  </div>
  <button class="btn" onclick="goTab('games')">Play a Game →</button>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// UTILITY
// ─────────────────────────────────────────────────────────────────────────────
function confirmClear() {
  if (confirm('Clear ALL history (games + sessions)? Export a backup first.')) {
    sessions=[]; games=[]; saveSessions(sessions); saveGames(games); render();
  }
}
function handleImport(input) {
  const file = input.files?.[0]; if (!file) return;
  importData(file).then(added => { showToast(`Imported ${added} record${added!==1?'s':''}.`, true); render(); })
    .catch(err => showToast(err.message, false));
  input.value='';
}
function showToast(msg, ok) {
  const el=document.getElementById('import-toast'); if(!el) return;
  el.textContent=msg; el.className=`toast show ${ok?'ok':'err'}`;
  setTimeout(()=>el.classList.remove('show'),4000);
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  updateNavActive();

  // Full-screen game states (no nav)
  if (state.screen === 'game-nine') { showNav(false); renderNineHole(); return; }
  if (state.screen === 'game-ladder') { showNav(false); renderLadderGame(); return; }
  if (state.screen === 'session')   { showNav(false); renderSession();    return; }

  showNav(true);

  let html = '';
  if      (state.screen === 'game-detail')          html = renderGameDetail();
  else if (state.screen === 'game-done')            html = renderGameDone();
  else if (state.screen === 'done')               html = renderDone();
  else if (state.tab    === 'games')              html = renderGames();
  else if (state.tab    === 'drills')             html = renderDrills();
  else if (state.tab    === 'practice')           html = renderPractice();
  else if (state.tab    === 'history')            html = renderHistory();

  document.getElementById('app').innerHTML = html;
}

initializeHoleScenarios();
render();
</script>
</body>
</html>
