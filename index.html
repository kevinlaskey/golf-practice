<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#f4f7f4"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="SGGrind"/>
<title>Short Game Grind</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
  /*
   * Bright Masters Palette — light theme
   * --bg:          #f4f7f4
   * --surface:     #ffffff
   * --green:       #1a5c34
   * --green-mid:   #2e7d4f
   * --green-light: #e8f2eb
   * --gold:        #b8892a
   * --text:        #1a2e22
   * --text-mid:    #4a6652
   * --text-faint:  #8aaa90
   * --border:      #d0dfd3
   * --red:         #c0392b
   */

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body {
    background: #f4f7f4;
    color: #1a2e22;
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100svh;
    overscroll-behavior: none;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  button:active { opacity: 0.8; }
  .serif { font-family: 'Playfair Display', serif; }

  #app { max-width: 480px; margin: 0 auto; padding: 0 18px 80px; }

  /* ── Nav ── */
  #nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #ffffff; border-top: 2px solid #d0dfd3;
    display: flex; z-index: 50;
    box-shadow: 0 -2px 16px rgba(26,92,52,.08);
  }
  #nav button {
    flex: 1; background: transparent; border: none; border-top: 3px solid transparent;
    color: #8aaa90; font-family: 'Source Sans 3', sans-serif; font-size: 10px;
    padding: 10px 0 12px; cursor: pointer; letter-spacing: .06em; text-transform: uppercase;
    transition: color .2s; margin-top: -2px;
  }
  #nav button.active { color: #1a5c34; border-top-color: #1a5c34; font-weight: 600; }

  /* ── Cards ── */
  .card {
    background: #ffffff; border: 1px solid #d0dfd3;
    border-radius: 12px; padding: 16px; margin-bottom: 9px;
    box-shadow: 0 1px 4px rgba(26,92,52,.06);
  }
  .card.clickable { cursor: pointer; transition: box-shadow .18s, border-color .18s, transform .1s; }
  .card.clickable:hover { border-color: #2e7d4f; box-shadow: 0 3px 12px rgba(26,92,52,.12); transform: translateY(-1px); }
  .card.clickable:active { transform: translateY(0); }

  .section-label {
    font-family: 'Playfair Display', serif; font-size: 10px; letter-spacing: .2em;
    text-transform: uppercase; color: #8aaa90; margin-bottom: 10px;
  }
  .badge {
    background: #fdf4e0; border: 1px solid #d4a843;
    border-radius: 18px; padding: 3px 11px; font-size: 11px; color: #b8892a;
    letter-spacing: .06em; white-space: nowrap; font-weight: 600;
  }
  .tip {
    background: #e8f2eb; border: 1px solid #b0d4bc;
    border-radius: 9px; padding: 10px 13px; font-size: 12px;
    color: #2e5c3a; line-height: 1.65; margin-top: 13px;
  }

  /* ── Buttons ── */
  .btn {
    background: #1a5c34; color: #ffffff; border: none; border-radius: 10px;
    padding: 14px 22px; font-size: 13px; font-weight: 700;
    font-family: 'Source Sans 3', sans-serif; cursor: pointer;
    letter-spacing: .1em; text-transform: uppercase; width: 100%; margin-top: 16px;
    box-shadow: 0 2px 10px rgba(26,92,52,.3);
    transition: background .15s, box-shadow .15s;
  }
  .btn:hover { background: #2e7d4f; }
  .btn-green { background: #2e7d4f; }
  .btn-ghost {
    background: #ffffff; color: #4a6652; border: 1px solid #d0dfd3;
    border-radius: 10px; padding: 10px 14px; font-size: 12px;
    cursor: pointer; font-family: 'Source Sans 3', sans-serif;
    transition: border-color .15s, color .15s, background .15s;
  }
  .btn-ghost:hover { border-color: #2e7d4f; color: #1a5c34; background: #f0f8f2; }
  .btn-danger { color: #c0392b; border-color: rgba(192,57,43,.35); background: #fff5f5; }
  .btn-muted { border: none; font-size: 11px; color: #aabfb0; background: transparent; }

  /* ── Inputs ── */
  .inp {
    background: #f4f7f4; border: 1.5px solid #d0dfd3;
    border-radius: 8px; padding: 10px 13px; font-size: 16px;
    color: #1a2e22; font-family: 'Source Sans 3', sans-serif; width: 100%;
    transition: border-color .15s, background .15s;
  }
  .inp:focus { outline: none; border-color: #2e7d4f; background: #ffffff; }
  textarea.inp { resize: none; }

  .counter-btn {
    background: #eef3ee; border: 1.5px solid #b8d4c0;
    border-radius: 8px; width: 48px; height: 48px; font-size: 24px;
    color: #1a5c34; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-family: 'Source Sans 3', sans-serif;
    transition: background .15s, border-color .15s;
  }
  .counter-btn:hover { background: #daeede; border-color: #2e7d4f; }

  /* ── Space badges ── */
  .space-badge {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 6px; padding: 3px 8px; font-size: 10px; white-space: nowrap;
    letter-spacing: .03em; font-weight: 600;
  }
  .space-full  { background: #fdf0ee; border: 1px solid #e8a090; color: #c0392b; }
  .space-edge  { background: #fdf4e0; border: 1px solid #d4a843; color: #b8892a; }
  .space-solo  { background: #e8f2eb; border: 1px solid #7abf8e; color: #1a5c34; }

  /* ── Club buttons ── */
  .club-btn { padding: 6px 12px; font-size: 12px; }
  .club-btn.selected { background: #e8f2eb; color: #1a5c34; border-color: #2e7d4f; font-weight: 600; }

  /* ── Progress dots ── */
  .dot { height: 7px; border-radius: 4px; background: #d0dfd3; transition: all .28s; }
  .dot.done   { background: #1a5c34; }
  .dot.active { background: #2e7d4f; }
  .dot.busy   { background: #e8a090; }
  .dot.skip   { background: #d0dfd3; }

  /* ── Skip overlay ── */
  #skip-overlay {
    position: fixed; inset: 0; background: rgba(26,46,34,.5);
    z-index: 200; display: none; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(3px);
  }
  #skip-overlay.open { display: flex; }
  #skip-sheet {
    background: #ffffff; border: 1px solid #d0dfd3; border-top: 3px solid #1a5c34;
    border-radius: 18px 18px 0 0; padding: 26px 22px 44px;
    width: 100%; max-width: 480px;
    box-shadow: 0 -8px 32px rgba(26,92,52,.15);
  }
  .skip-option {
    border-radius: 10px; padding: 13px 16px; font-size: 13px;
    cursor: pointer; font-family: 'Source Sans 3', sans-serif; text-align: left;
    line-height: 1.5; width: 100%; margin-bottom: 9px;
  }
  .skip-busy  { background: #fff5f5; border: 1px solid #e8a090; color: #c0392b; }
  .skip-today { background: #f4f7f4; border: 1px solid #d0dfd3; color: #4a6652; }

  /* ── Stat tiles ── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 22px; }
  .stat-tile {
    background: #ffffff; border: 1px solid #d0dfd3;
    border-radius: 11px; padding: 13px 15px;
    box-shadow: 0 1px 4px rgba(26,92,52,.05);
  }
  .stat-label { font-size: 10px; color: #8aaa90; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 5px; }
  .stat-value { font-family: 'Playfair Display', serif; font-size: 22px; color: #1a5c34; }

  /* ── Chart ── */
  .chart-wrap {
    background: #ffffff; border: 1px solid #d0dfd3;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(26,92,52,.05);
  }
  .chart-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .chart-label { font-size: 10px; color: #8aaa90; letter-spacing: .1em; text-transform: uppercase; }
  .chart-trend { font-size: 10px; font-weight: 600; }
  .chart-footer { display: flex; justify-content: space-between; font-size: 10px; color: #aabfb0; margin-top: 2px; }

  /* ── Toast / IO ── */
  .io-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .io-row .btn-ghost { flex: 1; font-size: 12px; }
  .toast { border-radius: 9px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
  .toast.show { display: block; }
  .toast.ok  { background: #e8f2eb; border: 1px solid #7abf8e; color: #1a5c34; }
  .toast.err { background: #fff5f5; border: 1px solid #e8a090; color: #c0392b; }

  /* ── Page header ── */
  .page-header { padding: 28px 0 20px; border-bottom: 2px solid #d0dfd3; margin-bottom: 20px; }
  .page-title { font-family: 'Playfair Display', serif; font-size: 26px; color: #1a2e22; }
  .page-sub { font-size: 12px; color: #8aaa90; margin-top: 4px; letter-spacing: .04em; }

  /* ── Session header ── */
  .session-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 14px; }

  /* ── Flex helpers ── */
  .row { display: flex; align-items: center; }
  .row-between { display: flex; align-items: flex-start; justify-content: space-between; }
  .gap-7 { gap: 7px; }
  .gap-8 { gap: 8px; }
  .gap-16 { gap: 16px; }
  .wrap { flex-wrap: wrap; }
  .flex-1 { flex: 1; }
  .flex-2 { flex: 2; }
  .mt-0 { margin-top: 0; }
  .center { text-align: center; }

  /* ── Games specific ── */

  /* 9-Hole score buttons: 0, 1, 2 */
  .score-btns { display: flex; gap: 8px; }
  .score-btn {
    flex: 1; height: 52px; border-radius: 10px; font-size: 22px; font-weight: 700;
    font-family: 'Playfair Display', serif; border: 2px solid #d0dfd3;
    background: #ffffff; color: #8aaa90; cursor: pointer;
    transition: all .15s;
  }
  .score-btn:hover { border-color: #2e7d4f; color: #2e7d4f; }
  .score-btn.sel-0 { background: #fff5f5; border-color: #c0392b; color: #c0392b; }
  .score-btn.sel-1 { background: #fdf4e0; border-color: #b8892a; color: #b8892a; }
  .score-btn.sel-2 { background: #e8f2eb; border-color: #1a5c34; color: #1a5c34; }

  /* Ladder 0/1 buttons */
  .ladder-btn {
    flex: 1; height: 52px; border-radius: 10px; font-size: 16px; font-weight: 700;
    font-family: 'Source Sans 3', sans-serif; border: 2px solid #d0dfd3;
    background: #ffffff; color: #8aaa90; cursor: pointer;
    transition: all .15s; letter-spacing: .05em;
  }
  .ladder-btn:hover { border-color: #2e7d4f; color: #2e7d4f; }
  .ladder-btn.sel-0 { background: #fff5f5; border-color: #c0392b; color: #c0392b; }
  .ladder-btn.sel-1 { background: #e8f2eb; border-color: #1a5c34; color: #1a5c34; }

  /* Hole row in 9-hole game */
  .hole-row {
    background: #ffffff; border: 1px solid #d0dfd3; border-radius: 12px;
    padding: 13px 14px; margin-bottom: 8px;
    box-shadow: 0 1px 3px rgba(26,92,52,.05);
  }
  .hole-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: #1a5c34; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .shot-type-pill {
    font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 20px;
  }
  .pill-chip  { background: #e8f2eb; color: #1a5c34; }
  .pill-pitch { background: #fdf4e0; color: #b8892a; }
  .pill-flop  { background: #fdf0ee; color: #c0392b; }

  /* Score summary ring */
  .score-ring {
    width: 80px; height: 80px; border-radius: 50%;
    border: 4px solid #1a5c34; display: flex; flex-direction: column;
    align-items: center; justify-content: center; margin: 0 auto 6px;
  }
  .score-ring-val { font-family: 'Playfair Display', serif; font-size: 28px; color: #1a5c34; line-height: 1; }
  .score-ring-max { font-size: 11px; color: #8aaa90; }

  /* Ladder shot row */
  .ladder-row {
    background: #ffffff; border: 1px solid #d0dfd3; border-radius: 10px;
    padding: 11px 14px; margin-bottom: 7px;
    display: flex; align-items: center; gap: 12px;
  }
  .ladder-shot-num {
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ladder-shot-num.club-8i   { background: #e8f2eb; color: #1a5c34; }
  .ladder-shot-num.club-52   { background: #fdf4e0; color: #b8892a; }

  /* Game history entry type badge */
  .game-type-badge {
    font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
    letter-spacing: .05em;
  }
  .gtb-nine  { background: #e8f2eb; color: #1a5c34; }
  .gtb-ladder{ background: #fdf4e0; color: #b8892a; }

  /* Practice library card */
  .practice-card {
    background: #ffffff; border: 1px solid #d0dfd3; border-radius: 12px;
    padding: 15px 16px; margin-bottom: 9px;
    box-shadow: 0 1px 4px rgba(26,92,52,.05);
  }
  .practice-tag {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    padding: 2px 8px; border-radius: 10px; display: inline-block; margin-bottom: 6px;
  }
  .ptag-putting  { background: #e8f2eb; color: #1a5c34; }
  .ptag-chipping { background: #fdf4e0; color: #b8892a; }
  .ptag-pitching { background: #fdf0ee; color: #c0392b; }
  .ptag-bunker   { background: #f0eef8; color: #6b5ea8; }
  .ptag-mental   { background: #eef5fb; color: #2980b9; }
</style>
</head>
<body>

<div id="app"></div>

<div id="nav">
  <button id="nav-games"   onclick="goTab('games')"  >🏆 Games</button>
  <button id="nav-plans"   onclick="goTab('plans')"  >⛳ Plans</button>
  <button id="nav-drills"  onclick="goTab('drills')" >📋 Drills</button>
  <button id="nav-practice" onclick="goTab('practice')">💡 Practice</button>
  <button id="nav-history" onclick="goTab('history')">📈 History</button>
</div>

<!-- Skip overlay (for session drills) -->
<div id="skip-overlay" onclick="closeSkip()">
  <div id="skip-sheet" onclick="event.stopPropagation()">
    <div class="serif" style="font-size:19px;color:#1a2e22;margin-bottom:4px">Skip this drill?</div>
    <div id="skip-drill-name" style="font-size:12px;color:#8aaa90;margin-bottom:18px"></div>
    <button class="skip-option skip-busy" onclick="doSkip('busy')">
      🚶 <strong>Green is busy</strong><br>
      <span style="font-size:11px;opacity:.8">Other people on the green, can't do this right now</span>
    </button>
    <button class="skip-option skip-today" onclick="doSkip('skipped')">
      ⏭ <strong>Skip for today</strong><br>
      <span style="font-size:11px;opacity:.8">Running short on time, not feeling it, etc.</span>
    </button>
    <button class="btn-ghost btn-muted" style="width:100%;margin-top:4px" onclick="closeSkip()">← Go back to drill</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// GAME DATA
// ─────────────────────────────────────────────────────────────────────────────

// 9-Hole game: 3 chip & run, 3 pitch, 3 flop — arranged in alternating order
const NINE_HOLES = [
  { hole:1, type:'chip',  label:'Chip & Run',  desc:'Tight lie, just off the fringe. Land it 2–3 ft on, let it run to the pin.',       pill:'pill-chip'  },
  { hole:2, type:'pitch', label:'Pitch Shot',  desc:'15–20 yds out, some loft needed. Land it soft past a slope or hazard.',            pill:'pill-pitch' },
  { hole:3, type:'flop',  label:'Flop Shot',   desc:'Ball is close to the green but you need height fast. Open face, full swing.',      pill:'pill-flop'  },
  { hole:4, type:'chip',  label:'Chip & Run',  desc:'Uphill lie, ball sitting up. Hood the 8-iron, let it bump and release.',           pill:'pill-chip'  },
  { hole:5, type:'pitch', label:'Pitch Shot',  desc:'20–25 yds, elevated green. Pick a landing spot 3 ft onto the surface.',            pill:'pill-pitch' },
  { hole:6, type:'flop',  label:'Flop Shot',   desc:'Tight downhill lie with little green to work with. Commit and accelerate.',         pill:'pill-flop'  },
  { hole:7, type:'chip',  label:'Chip & Run',  desc:'From the rough, ball sitting down. Use the 56° with a firm, punchy stroke.',       pill:'pill-chip'  },
  { hole:8, type:'pitch', label:'Pitch Shot',  desc:'Side-hill lie, ball below your feet. Choke down and aim left of target.',          pill:'pill-pitch' },
  { hole:9, type:'flop',  label:'Flop Shot',   desc:'Final hole — hardest lie you can find. Buried in rough, green sloping away.',      pill:'pill-flop'  },
];

// Ladder game: 4 shots with 8i, 4 shots with 52°
const LADDER_SHOTS = [
  { idx:0, club:'8i',  clubLabel:'8-Iron',   desc:'10 yds — bump and run from just off the edge. Land 2 ft on, run to hole.' },
  { idx:1, club:'8i',  clubLabel:'8-Iron',   desc:'15 yds — straight uphill. Hood the face slightly, smooth tempo.' },
  { idx:2, club:'8i',  clubLabel:'8-Iron',   desc:'20 yds — across a slope. Play to the high side, let it feed down.' },
  { idx:3, club:'8i',  clubLabel:'8-Iron',   desc:'25 yds — slight downhill. Use less swing, let the slope do the work.' },
  { idx:4, club:'52',  clubLabel:'52° Wedge', desc:'10 yds — tight lie, minimum loft. Hands forward, dead-hands impact.' },
  { idx:5, club:'52',  clubLabel:'52° Wedge', desc:'15 yds — fluffy lie. Normal setup, trust the loft to pop it out.' },
  { idx:6, club:'52',  clubLabel:'52° Wedge', desc:'20 yds — from the rough collar. Firm grip, steeper angle of attack.' },
  { idx:7, club:'52',  clubLabel:'52° Wedge', desc:'25 yds — hardest shot. Pick a landing spot 1/3 of the way, commit fully.' },
];

// Practice library
const PRACTICES = [
  {
    tag:'Putting', tagCls:'ptag-putting',
    title:'Gate Drill',
    desc:'Push two tees in the ground just wider than your putter head, 2 feet from the hole. Putt through the gate without clipping a tee. Do 20 in a row before moving back. Builds stroke path and face control fast.'
  },
  {
    tag:'Putting', tagCls:'ptag-putting',
    title:'Pace Control Circuit',
    desc:'Drop 5 balls at 10, 20, 30, 40, and 50 feet from a hole. Hit one putt from each distance — no second chances. Goal: every ball finishes between the hole and 3 feet past. Trains lag putting under light pressure.'
  },
  {
    tag:'Chipping', tagCls:'ptag-chipping',
    title:'One-Club, Five Lies',
    desc:'Take only your 8-iron. Find five genuinely different lies around the green — fluffy, tight, rough collar, uphill, downhill. Hit three chips from each. The constraint forces creativity and builds real versatility.'
  },
  {
    tag:'Chipping', tagCls:'ptag-chipping',
    title:'Landing Zone Focus',
    desc:'Lay a towel or headcover 4 feet onto the green. Chip 15 balls from the same spot trying only to land on the towel — ignore the hole entirely. Once you can hit it consistently, the hole takes care of itself.'
  },
  {
    tag:'Pitching', tagCls:'ptag-pitching',
    title:'Distance Ladder',
    desc:'Mark out 10, 20, 30, and 40 yards. Hit 3 balls at each distance with your 56°. The rule: each set must land within 6 feet of the target before you move on. Builds precise yardage control across the full pitch range.'
  },
  {
    tag:'Pitching', tagCls:'ptag-pitching',
    title:'Clock Face Pitching',
    desc:'Pick a target 25 yards out. Hit pitches using 3 different backswing lengths — 7 o\'clock (short), 9 o\'clock (medium), 11 o\'clock (full). Measure where each ball finishes. You\'re building your personal pitch yardage chart.'
  },
  {
    tag:'Mental', tagCls:'ptag-mental',
    title:'Pressure 3s',
    desc:'Pick any shot you\'re comfortable with. The rule: you must make 3 in a row to finish. If you miss, start the count over. Takes about 10 minutes but simulates the feeling of needing to execute under low stakes pressure. Deceptively hard.'
  },
];

// ─────────────────────────────────────────────────────────────────────────────
// DRILL DATA (kept from original)
// ─────────────────────────────────────────────────────────────────────────────
const DRILLS = [
  { id:"updown",       name:"Up & Down Game",         duration:10, spaceNeeded:"full", spaceLabel:"Needs open green",
    description:"Drop 5 balls in 5 different spots (tight lie, fluffy, uphill, downhill, side slope). Chip then putt out each one like a real hole.",
    metric:"up_downs", metricLabel:"Up-and-downs made", metricMax:5, metricType:"counter",
    tip:"Vary your spots every session. The rough/fluffy lie is where most strokes are lost.",
    clubs:["56°","60°","8i bump","52°","Any"] },
  { id:"matrix",       name:"9-Shot Matrix",           duration:15, spaceNeeded:"full", spaceLabel:"Needs open green",
    description:"Pick 2 clubs. Hit from 3 distances: 5 yds, 15 yds, 25 yds. 3 balls each combo. Pace off proximity after each set.",
    metric:"proximity", metricLabel:"Avg proximity (feet)", metricMax:null, metricType:"input",
    tip:"Be honest with distances — this is how you find out which club you actually trust.",
    clubs:["52° + 56°","56° + 60°","60° + 8i","52° + 8i","56° + 8i"] },
  { id:"clock",        name:"Clock Drill",             duration:15, spaceNeeded:"solo", spaceLabel:"Single hole only",
    description:"Place balls at 3, 6, 9, 12 o'clock around one hole. Make all 4 to advance to next ring. Start at 4 feet.",
    metric:"clock_dist", metricLabel:"Farthest ring completed (ft)", metricMax:null, metricType:"input",
    tip:"The 6 o'clock (straight uphill) is your confidence builder. Finish there when struggling.",

// ─────────────────────────────────────────────────────────────────────────────
// STORAGE
// ─────────────────────────────────────────────────────────────────────────────
const STORAGE_KEY    = 'sg_sessions_v3';
const GAME_STORE_KEY = 'sg_games_v1';

function loadSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
function saveSessions(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
}
function loadGames() {
  try { return JSON.parse(localStorage.getItem(GAME_STORE_KEY) || '[]'); } catch { return []; }
}
function saveGames(g) {
  try { localStorage.setItem(GAME_STORE_KEY, JSON.stringify(g)); } catch(e) {}
}

let sessions = loadSessions();
let games    = loadGames();

function addSession(s) { s.id = crypto.randomUUID(); sessions.push(s); saveSessions(sessions); }
function addGame(g)    { g.id = crypto.randomUUID(); games.push(g);    saveGames(games); }

function exportData() {
  const payload = {
    app:'short-game-grind', version:'2.0',
    exported: new Date().toISOString(),
    sessions, games
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `sggrind-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const p = JSON.parse(e.target.result);
        let added = 0;
        if (Array.isArray(p.sessions)) {
          const ids = new Set(sessions.map(s => s.id).filter(Boolean));
          const newS = p.sessions.filter(s => !s.id || !ids.has(s.id));
          sessions = [...sessions, ...newS].sort((a,b) => new Date(a.date)-new Date(b.date));
          saveSessions(sessions); added += newS.length;
        }
        if (Array.isArray(p.games)) {
          const ids = new Set(games.map(g => g.id).filter(Boolean));
          const newG = p.games.filter(g => !g.id || !ids.has(g.id));
          games = [...games, ...newG].sort((a,b) => new Date(a.date)-new Date(b.date));
          saveGames(games); added += newG.length;
        }
        resolve(added);
      } catch(err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('File read failed'));
    reader.readAsText(file);
  });
}

  state.nineScores[idx] = score;
  // re-render just the score buttons for this hole
  NINE_HOLES.forEach((_, i) => {
    [0,1,2].forEach(s => {
      const btn = document.getElementById(`sbtn-${i}-${s}`);
      if (btn) {
        btn.className = `score-btn${state.nineScores[i] === s ? ' sel-'+s : ''}`;
      }
    });
  });
  updateNineTotal();
}

function updateNineTotal() {
  const total = Object.values(state.nineScores).reduce((a,b) => a+b, 0);
  const scored = Object.keys(state.nineScores).length;
  const el = document.getElementById('nine-running-total');
  if (el) el.textContent = `${total} pts · ${scored}/9 holes`;
}

function finishNineHole() {
  const scored = Object.keys(state.nineScores).length;
  if (scored < 9 && !confirm(`You've only scored ${scored} of 9 holes. Finish anyway?`)) return;

  const scores = NINE_HOLES.map((h, i) => ({ ...h, score: state.nineScores[i] ?? null }));
  const total = scores.reduce((a,h) => a + (h.score ?? 0), 0);

  // breakdown by type
  const byType = { chip:0, pitch:0, flop:0 };
  const maxByType = { chip:0, pitch:0, flop:0 };
  scores.forEach(h => {
    maxByType[h.type] += 2;
    byType[h.type] += (h.score ?? 0);
  });

  const game = {
    type: 'nine', date: new Date().toISOString(),
    total, maxPossible: 18, scores,
    byType, maxByType,
  };
  addGame(game);
  state.lastGame = game;
  state.screen = 'game-done';
  render();
}

function startSession(planIdx) {
  const plan = PLANS[planIdx];
  state.activePlan   = plan;
  state.activeDrills = plan.drills.map(id => getDrill(id)).filter(Boolean);
  state.currentIdx   = 0;
  state.drillData    = {};
  state.skipped      = {};
  state.clubSel      = {};
  state.screen       = 'session';
  startTimer();
  render();
}

function advanceDrill() {
  if (state.currentIdx < state.activeDrills.length - 1) { state.currentIdx++; renderSession(); }
  else finishSession();
}

function openSkip() {
  const drill = state.activeDrills[state.currentIdx];
  document.getElementById('skip-drill-name').innerHTML =
    `<strong style="color:#1a5c34">${drill.name}</strong> — tell us why so it logs correctly`;
  document.getElementById('skip-overlay').classList.add('open');
}
function closeSkip() { document.getElementById('skip-overlay').classList.remove('open'); }
function doSkip(reason) { state.skipped[state.currentIdx] = reason; closeSkip(); advanceDrill(); }

function finishSession() {
  stopTimer();
  const highlights = [], metrics = {};
  let skCount = 0;
  state.activeDrills.forEach((drill, i) => {
    if (state.skipped[i]) { skCount++; return; }
    const data = state.drillData[i] || {};
    const val = v => data[v];
    if (drill.id==='updown'       && val('up_downs')!==undefined) { highlights.push(`${val('up_downs')}/5 up-downs`);           metrics.up_downs=Number(val('up_downs')); }
    if (drill.id==='matrix'       && val('proximity'))             { highlights.push(`${val('proximity')}ft proximity`);         metrics.proximity=val('proximity'); }
    if (drill.id==='clock'        && val('clock_dist'))            { highlights.push(`${val('clock_dist')}ft clock`);            metrics.clock_dist=val('clock_dist'); }
    if (drill.id==='backswing'    && val('backswing_10'))          { highlights.push(`Backswing 10": ${val('backswing_10')}ft`); }
    if (drill.id==='landing_spot' && val('landing_hits')!==undefined){ highlights.push(`${val('landing_hits')}/10 landing spot`); metrics.landing_hits=Number(val('landing_hits')); }
    if (drill.id==='ladder'       && val('ladder_score'))          { highlights.push(`Ladder: ${val('ladder_score')} pts`);      metrics.ladder_score=val('ladder_score'); }
    if (drill.id==='one_club'     && val('one_club_ud')!==undefined){ highlights.push(`${val('one_club_ud')}/5 one-club`); }
    if (drill.id==='bump_run_race'&& val('bump_close')!==undefined) { highlights.push(`${val('bump_close')}/5 bump & run`); }
    if (drill.id==='worst_lie'    && val('worst_ud')!==undefined)  { highlights.push(`${val('worst_ud')}/5 bad lies`); }
    if (drill.id==='three_ball'   && val('three_ball_ring'))       { highlights.push(`3-ball: ${val('three_ball_ring')}ft ring`); metrics.three_ball_ring=val('three_ball_ring'); }
    if (drill.id==='fringe_chip'  && val('fringe_close')!==undefined){ highlights.push(`${val('fringe_close')}/10 fringe`); }
  });
  const busyCount = Object.values(state.skipped).filter(r=>r==='busy').length;
  if (busyCount>0) highlights.push(`${busyCount} skipped — busy green`);
  if (!highlights.length) highlights.push('Session logged');
  const session = {
    date: new Date().toISOString(), planName: state.activePlan.name,
    drillCount: state.activeDrills.length - skCount, skipped: skCount,
    highlights, metrics, duration: Math.round(state.timerSecs/60),
  };
  addSession(session);
  state.lastSession = session;
  state.screen = 'done';
  render();
}

function adjustCounter(idx, metric, delta, max) {
  const cur = state.drillData[idx]?.[metric] ?? 0;

function computeStats() {
  const ud    = sessions.map(s=>s.metrics?.up_downs).filter(v=>v!==undefined);
  const prox  = sessions.map(s=>Number(s.metrics?.proximity)).filter(n=>n>0&&!isNaN(n));
  const clock = sessions.map(s=>Number(s.metrics?.clock_dist)).filter(n=>n>0&&!isNaN(n));
  const nineGs  = games.filter(g=>g.type==='nine');
  const ladderGs= games.filter(g=>g.type==='ladder');
  return {
    total: sessions.length,
    totalMins: sessions.reduce((a,s)=>a+(s.duration||0),0),
    bestUD:    ud.length    ? Math.max(...ud)   : null,
    bestProx:  prox.length  ? Math.min(...prox) : null,
    avgUD:     ud.length    ? (ud.reduce((a,b)=>a+b,0)/ud.length).toFixed(1) : null,
    bestClock: clock.length ? Math.max(...clock): null,
    totalGames: games.length,
    bestNine:   nineGs.length   ? Math.max(...nineGs.map(g=>g.total))   : null,
    avgNine:    nineGs.length   ? (nineGs.reduce((a,g)=>a+g.total,0)/nineGs.length).toFixed(1) : null,
    bestLadder: ladderGs.length ? Math.max(...ladderGs.map(g=>g.total)) : null,
    avgLadder:  ladderGs.length ? (ladderGs.reduce((a,g)=>a+g.total,0)/ladderGs.length).toFixed(1) : null,
  };
}

// CHART
// ─────────────────────────────────────────────────────────────────────────────
function renderChart(data, label, lowerBetter) {
  // data = array of numbers (already extracted)
  const nums = data.filter(n => !isNaN(n) && n !== null);
  if (nums.length < 2) return '';
  const max = Math.max(...nums), min = Math.min(...nums), range = max-min||1;
  const W=260, H=52, P=8;
  const pts = nums.map((v,i) => {
    const x = P + (i/(nums.length-1))*(W-P*2);
    const y = H-P-((v-min)/range)*(H-P*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const circles = nums.map((v,i) => {
    const x = P + (i/(nums.length-1))*(W-P*2);
    const y = H-P-((v-min)/range)*(H-P*2);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#1a5c34"/>`;
  }).join('');
  const trend = nums[nums.length-1]-nums[0];
  const improving = lowerBetter ? trend<0 : trend>0;
  const trendColor = improving ? '#2e7d4f' : trend===0 ? '#aabfb0' : '#c0392b';
  const trendLabel = improving ? '↑ Improving' : trend===0 ? '→ Steady' : '↓ Declining';
  return `
  <div class="chart-wrap">
    <div class="chart-header">
      <span class="chart-label">${label}</span>
      <span class="chart-trend" style="color:${trendColor}">${trendLabel}</span>
    </div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
      <polyline points="${pts}" fill="none" stroke="#1a5c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${circles}
    </svg>
    <div class="chart-footer"><span>${nums[0]}</span><span style="color:#1a5c34">${nums[nums.length-1]}</span></div>
  </div>`;
}

        <div class="row gap-7 wrap">
          <span class="shot-type-pill pill-chip">3 Chip &amp; Run</span>
          <span class="shot-type-pill pill-pitch">3 Pitch</span>
          <span class="shot-type-pill pill-flop">3 Flop</span>
        </div>
      </div>
      <div style="text-align:center;padding-left:12px;flex-shrink:0">
        <div style="font-size:10px;color:#8aaa90;margin-bottom:2px">Best</div>
        <div class="serif" style="font-size:22px;color:#1a5c34">${bestNine !== null ? bestNine : '—'}</div>
        <div style="font-size:10px;color:#8aaa90">/ 18</div>
      </div>
    </div>
    <div style="margin-top:10px;font-size:11px;color:#4a6652">Score each shot: 0 (miss) · 1 (close) · 2 (tap-in or in) →</div>
  </div>

  <div class="card clickable" onclick="startLadder()" style="border-left:4px solid #b8892a">
    <div class="row-between" style="align-items:flex-start">
      <div>
        <div class="serif" style="font-size:18px;color:#1a2e22;margin-bottom:4px">Club Ladder</div>
        <div style="font-size:12px;color:#8aaa90;margin-bottom:8px">8 shots · 2 clubs · max 8 pts</div>
        <div class="row gap-7 wrap">
          <span class="shot-type-pill pill-chip">4 × 8-Iron</span>
          <span class="shot-type-pill pill-pitch">4 × 52°</span>
        </div>
      </div>
      <div style="text-align:center;padding-left:12px;flex-shrink:0">
        <div style="font-size:10px;color:#8aaa90;margin-bottom:2px">Best</div>
        <div class="serif" style="font-size:22px;color:#b8892a">${bestLadder !== null ? bestLadder : '—'}</div>
        <div style="font-size:10px;color:#8aaa90">/ 8</div>
      </div>
    </div>
    <div style="margin-top:10px;font-size:11px;color:#4a6652">Score each shot: 0 (miss) · 1 (good) — tap as you go →</div>
  </div>

  ${recentHTML}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — 9-HOLE GAME
// ─────────────────────────────────────────────────────────────────────────────
function renderNineHole() {
  const total = Object.values(state.nineScores).reduce((a,b)=>a+b,0);
  const scored = Object.keys(state.nineScores).length;

  const holesHTML = NINE_HOLES.map((h, i) => {
    const cur = state.nineScores[i];
    return `
    <div class="hole-row">
      <div class="row gap-7" style="margin-bottom:9px;align-items:center">
        <div class="hole-num">${h.hole}</div>
        <div>
          <span class="shot-type-pill ${h.pill}" style="font-size:9px">${h.label}</span>
        </div>
        <div style="font-size:11px;color:#4a6652;flex:1;margin-left:4px">${h.desc}</div>
      </div>
      <div class="score-btns">
        <button id="sbtn-${i}-0" class="score-btn${cur===0?' sel-0':''}" onclick="setNineScore(${i},0)">0</button>
        <button id="sbtn-${i}-1" class="score-btn${cur===1?' sel-1':''}" onclick="setNineScore(${i},1)">1</button>
        <button id="sbtn-${i}-2" class="score-btn${cur===2?' sel-2':''}" onclick="setNineScore(${i},2)">2</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <div class="session-header">
    <div class="serif" style="font-size:20px;color:#1a2e22">9-Hole Game</div>
    <div class="badge" id="nine-running-total">${total} pts · ${scored}/9 holes</div>
  </div>
  <div style="font-size:12px;color:#8aaa90;margin-bottom:16px">0 = miss &nbsp;·&nbsp; 1 = close &nbsp;·&nbsp; 2 = tap-in or better</div>

  ${holesHTML}

  <button class="btn btn-green" style="margin-top:8px" onclick="finishNineHole()">Finish & Save ✓</button>
  <div class="center" style="margin-top:13px">
    <button class="btn-ghost btn-muted" onclick="goTab('games')">← Back to Games</button>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — LADDER GAME
// ─────────────────────────────────────────────────────────────────────────────
function renderLadderGame() {
  const total = Object.values(state.ladderScores).reduce((a,b)=>a+b,0);
  const scored = Object.keys(state.ladderScores).length;

  const shotsHTML = LADDER_SHOTS.map(s => {
    const cur = state.ladderScores[s.idx];
    const is8i = s.club === '8i';
    return `
    <div class="ladder-row">
      <div class="ladder-shot-num ${is8i ? 'club-8i' : 'club-52'}">${s.idx+1}</div>
      <div style="flex:1">
        <div style="font-size:11px;font-weight:600;color:${is8i?'#1a5c34':'#b8892a'};margin-bottom:2px">${s.clubLabel}</div>
        <div style="font-size:11px;color:#4a6652;line-height:1.45">${s.desc}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button id="lbtn-${s.idx}-0" class="ladder-btn${cur===0?' sel-0':''}" onclick="setLadderScore(${s.idx},0)">0</button>
        <button id="lbtn-${s.idx}-1" class="ladder-btn${cur===1?' sel-1':''}" onclick="setLadderScore(${s.idx},1)">1</button>
      </div>
    </div>`;
  }).join('');

  // Section headers
  const with8iHeader = `<div class="section-label" style="margin-top:4px;color:#1a5c34">8-Iron — 4 Shots</div>`;
  const with52Header = `<div class="section-label" style="margin-top:16px;color:#b8892a">52° Wedge — 4 Shots</div>`;

  const shots8i = LADDER_SHOTS.filter(s=>s.club==='8i').map(s => {
    const cur = state.ladderScores[s.idx];
    return `<div class="ladder-row">
      <div class="ladder-shot-num club-8i">${s.idx+1}</div>
      <div style="flex:1">
        <div style="font-size:11px;color:#4a6652;line-height:1.45">${s.desc}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button id="lbtn-${s.idx}-0" class="ladder-btn${cur===0?' sel-0':''}" onclick="setLadderScore(${s.idx},0)" style="width:44px;height:44px">0</button>
        <button id="lbtn-${s.idx}-1" class="ladder-btn${cur===1?' sel-1':''}" onclick="setLadderScore(${s.idx},1)" style="width:44px;height:44px">1</button>
      </div>
    </div>`;
  }).join('');

  const shots52 = LADDER_SHOTS.filter(s=>s.club==='52').map(s => {
    const cur = state.ladderScores[s.idx];
    return `<div class="ladder-row">
      <div class="ladder-shot-num club-52">${s.idx+1}</div>
      <div style="flex:1">
        <div style="font-size:11px;color:#4a6652;line-height:1.45">${s.desc}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button id="lbtn-${s.idx}-0" class="ladder-btn${cur===0?' sel-0':''}" onclick="setLadderScore(${s.idx},0)" style="width:44px;height:44px">0</button>
        <button id="lbtn-${s.idx}-1" class="ladder-btn${cur===1?' sel-1':''}" onclick="setLadderScore(${s.idx},1)" style="width:44px;height:44px">1</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <div class="session-header">
    <div class="serif" style="font-size:20px;color:#1a2e22">Club Ladder</div>
    <div class="badge" id="ladder-running-total">${total} pts · ${scored}/8 shots</div>
  </div>
  <div style="font-size:12px;color:#8aaa90;margin-bottom:16px">Tap 0 or 1 after each shot &nbsp;·&nbsp; 1 = good shot</div>

  ${with8iHeader}
  ${shots8i}
  ${with52Header}
  ${shots52}

  <button class="btn btn-green" style="margin-top:8px" onclick="finishLadder()">Finish & Save ✓</button>
  <div class="center" style="margin-top:13px">
    <button class="btn-ghost btn-muted" onclick="goTab('games')">← Back to Games</button>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — GAME DONE
// ─────────────────────────────────────────────────────────────────────────────
function renderGameDone() {
  const g = state.lastGame;
  const pct = Math.round((g.total / g.maxPossible) * 100);
  const grade = pct >= 80 ? '🔥 Excellent' : pct >= 60 ? '👍 Solid' : pct >= 40 ? '📈 Building' : '💪 Keep going';

  let breakdownHTML = '';
  if (g.type === 'nine') {
    breakdownHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
      ${[['Chip & Run','chip','pill-chip'],['Pitch','pitch','pill-pitch'],['Flop','flop','pill-flop']].map(([lbl,key,cls]) => `
        <div style="text-align:center;background:#f4f7f4;border-radius:10px;padding:10px 6px;border:1px solid #d0dfd3">
          <div class="shot-type-pill ${cls}" style="font-size:9px;margin-bottom:6px;display:inline-block">${lbl}</div>
          <div class="serif" style="font-size:20px;color:#1a5c34">${g.byType[key]}</div>
          <div style="font-size:10px;color:#8aaa90">/ ${g.maxByType[key]}</div>
        </div>`).join('')}
    </div>
    <div class="tip" style="margin-top:12px">
      ${g.byType.chip < g.byType.pitch && g.byType.chip < g.byType.flop
        ? '💡 Chip & run was your weakest today. Focus next session on bumping the ball onto the green with the 8-iron.'
        : g.byType.flop < g.byType.chip && g.byType.flop < g.byType.pitch
        ? '💡 Flop shots were the challenge. Try the Landing Spot Game next session to build feel for high, soft shots.'
        : g.byType.pitch < g.byType.chip && g.byType.pitch < g.byType.flop
        ? '💡 Pitching was the weak spot today. Work on your clock-face distances — 7, 9, and 11 o\'clock backswings.'
        : '💡 Balanced performance across all three shot types. Solid round.'}
    </div>`;
  } else {
    breakdownHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <div style="text-align:center;background:#e8f2eb;border-radius:10px;padding:12px;border:1px solid #b0d4bc">
        <div style="font-size:10px;font-weight:600;color:#1a5c34;margin-bottom:4px">8-IRON</div>
        <div class="serif" style="font-size:26px;color:#1a5c34">${g.by8i}<span style="font-size:13px;color:#8aaa90"> /4</span></div>
      </div>
      <div style="text-align:center;background:#fdf4e0;border-radius:10px;padding:12px;border:1px solid #d4a843">
        <div style="font-size:10px;font-weight:600;color:#b8892a;margin-bottom:4px">52° WEDGE</div>
        <div class="serif" style="font-size:26px;color:#b8892a">${g.by52}<span style="font-size:13px;color:#8aaa90"> /4</span></div>
      </div>
    </div>
    <div class="tip" style="margin-top:12px">
      ${g.by8i > g.by52
        ? '💡 8-iron was your stronger club today. Your 52° needs work — focus on clean contact from different distances.'
        : g.by52 > g.by8i
        ? '💡 52° wedge performed better. The 8-iron bump & run might need some pace calibration — try the Bump & Run Race drill.'
        : '💡 Even performance from both clubs. Consistency is a great sign — now push the distances further next time.'}
    </div>`;
  }

  return `
  <div style="padding:36px 0 20px;text-align:center">
    <div style="font-size:13px;color:#8aaa90;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">${g.type==='nine'?'9-Hole Game':'Club Ladder'}</div>
    <div class="score-ring">
      <div class="score-ring-val">${g.total}</div>
      <div class="score-ring-max">/ ${g.maxPossible}</div>
    </div>
    <div style="font-size:15px;font-weight:600;color:#1a5c34;margin-top:8px">${grade}</div>
    <div style="font-size:11px;color:#8aaa90;margin-top:2px">${pct}% · ${fmtDate(new Date())}</div>
  </div>
  <div class="card">
    <div class="section-label">Breakdown</div>
    ${breakdownHTML}
  </div>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn-ghost flex-1" onclick="goTab('games')" style="margin-top:0">← Games</button>
    <button class="btn flex-1" onclick="${g.type==='nine'?'startNineHole()':'startLadder()'}" style="margin-top:0">Play Again</button>
  </div>
  <div class="center" style="margin-top:10px">
    <button class="btn-ghost btn-muted" onclick="goTab('practice')">💡 See Practice Ideas</button>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// GAME DETAIL (drill-down from history)
// ─────────────────────────────────────────────────────────────────────────────
function viewGame(gameId) {
  state.viewingGame = games.find(g => g.id === gameId) || null;
  if (!state.viewingGame) return;
  state.screen = 'game-detail';
  render();
}

function renderGameDetail() {
  const g = state.viewingGame;
  if (!g) { goTab('history'); return; }

  const pct   = Math.round((g.total / g.maxPossible) * 100);
  const grade = pct >= 80 ? '🔥 Excellent' : pct >= 60 ? '👍 Solid' : pct >= 40 ? '📈 Building' : '💪 Keep going';
  const isNine = g.type === 'nine';

  // ── Score bar helper ──
  function scoreBar(val, max, color) {
    const w = max > 0 ? Math.round((val/max)*100) : 0;
    return `<div style="height:8px;background:#eef3ee;border-radius:4px;overflow:hidden;margin-top:4px">
      <div style="height:100%;width:${w}%;background:${color};border-radius:4px;transition:width .4s"></div>
    </div>`;
  }

  // ── Score dot (0/1/2 or 0/1) ──
  function scoreDot(val, max) {
    if (val === null || val === undefined) return `<span style="font-size:12px;color:#d0dfd3">—</span>`;
    const color = max === 2
      ? (val === 2 ? '#1a5c34' : val === 1 ? '#b8892a' : '#c0392b')
      : (val === 1 ? '#1a5c34' : '#c0392b');
    const label = String(val);
    return `<span style="display:inline-flex;align-items:center;justify-content:center;
      width:26px;height:26px;border-radius:50%;background:${color};
      color:#fff;font-size:12px;font-weight:700">${label}</span>`;
  }

  let summaryHTML = '';
  let detailHTML  = '';

  if (isNine) {
    // Type breakdown summary
    const types = [
      { key:'chip',  label:'Chip & Run', pill:'pill-chip',  color:'#1a5c34' },
      { key:'pitch', label:'Pitch',      pill:'pill-pitch', color:'#b8892a' },
      { key:'flop',  label:'Flop',       pill:'pill-flop',  color:'#c0392b' },
    ];
    summaryHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
        ${types.map(t => `
          <div style="background:#f4f7f4;border:1px solid #d0dfd3;border-radius:10px;padding:10px 8px;text-align:center">
            <span class="shot-type-pill ${t.pill}" style="font-size:9px;margin-bottom:6px;display:inline-block">${t.label}</span>
            <div class="serif" style="font-size:22px;color:${t.color}">${g.byType[t.key]}</div>
            <div style="font-size:10px;color:#8aaa90">/ ${g.maxByType[t.key]}</div>
            ${scoreBar(g.byType[t.key], g.maxByType[t.key], t.color)}
          </div>`).join('')}
      </div>`;

    // Weakest type tip
    const worst = types.slice().sort((a,b) =>
      (g.byType[a.key]/g.maxByType[a.key]) - (g.byType[b.key]/g.maxByType[b.key]))[0];
    const tips = {
      chip:  'Chip & run was your weakest — focus on bumping the ball onto the green with the 8-iron, landing 2–3 ft on.',
      pitch: 'Pitching needs work — practice clock-face distances: 7, 9, and 11 o\'clock backswings with your 52°.',
      flop:  'Flop shots were the challenge — try the Landing Spot Game to build feel for high, soft shots from tight lies.',
    };
    summaryHTML += `<div class="tip" style="margin-bottom:16px">💡 ${tips[worst.key]}</div>`;

    // Hole-by-hole detail
    detailHTML = `
      <div class="section-label" style="margin-top:4px">Hole by Hole</div>
      ${(g.scores || []).map((h, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 0;
          border-bottom:${i < g.scores.length-1 ? '1px solid #eef3ee' : 'none'}">
          <div class="hole-num" style="flex-shrink:0">${h.hole}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
              <span class="shot-type-pill ${h.pill}" style="font-size:9px">${h.label}</span>
            </div>
            <div style="font-size:11px;color:#4a6652;line-height:1.4">${h.desc}</div>
          </div>
          <div style="flex-shrink:0">${scoreDot(h.score, 2)}</div>
        </div>`).join('')}`;

  } else {
    // Ladder: club breakdown
    summaryHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        <div style="background:#e8f2eb;border:1px solid #b0d4bc;border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:10px;font-weight:700;color:#1a5c34;margin-bottom:4px;letter-spacing:.06em">8-IRON</div>
          <div class="serif" style="font-size:28px;color:#1a5c34">${g.by8i}<span style="font-size:13px;color:#8aaa90;font-family:'Source Sans 3',sans-serif"> /4</span></div>
          ${scoreBar(g.by8i, 4, '#1a5c34')}
        </div>
        <div style="background:#fdf4e0;border:1px solid #d4a843;border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:10px;font-weight:700;color:#b8892a;margin-bottom:4px;letter-spacing:.06em">52° WEDGE</div>
          <div class="serif" style="font-size:28px;color:#b8892a">${g.by52}<span style="font-size:13px;color:#8aaa90;font-family:'Source Sans 3',sans-serif"> /4</span></div>
          ${scoreBar(g.by52, 4, '#b8892a')}
        </div>
      </div>`;

    const ladderTip = g.by8i > g.by52
      ? '8-iron was stronger today. Your 52° needs work — focus on clean contact and a consistent landing spot.'
      : g.by52 > g.by8i
      ? '52° wedge performed better. The 8-iron bump & run may need pace calibration — try the Bump & Run Race drill.'
      : 'Even split between both clubs — solid consistency. Push the distances a bit further next time.';
    summaryHTML += `<div class="tip" style="margin-bottom:16px">💡 ${ladderTip}</div>`;

    // Shot-by-shot detail
    const shots8i = (g.shots || []).filter(s => s.club === '8i');
    const shots52 = (g.shots || []).filter(s => s.club === '52');

    function shotRows(shots, color) {
      return shots.map((s, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 0;
          border-bottom:${i < shots.length-1 ? '1px solid #eef3ee' : 'none'}">
          <div class="ladder-shot-num ${s.club==='8i'?'club-8i':'club-52'}" style="flex-shrink:0">${s.idx+1}</div>
          <div style="flex:1;font-size:11px;color:#4a6652;line-height:1.4">${s.desc}</div>
          <div style="flex-shrink:0">${scoreDot(s.score, 1)}</div>
        </div>`).join('');
    }

    detailHTML = `
      <div class="section-label" style="margin-top:4px;color:#1a5c34">8-Iron Shots</div>
      <div style="background:#fff;border:1px solid #d0dfd3;border-radius:10px;padding:4px 12px;margin-bottom:12px">
        ${shotRows(shots8i, '#1a5c34')}
      </div>
      <div class="section-label" style="color:#b8892a">52° Wedge Shots</div>
      <div style="background:#fff;border:1px solid #d0dfd3;border-radius:10px;padding:4px 12px">
        ${shotRows(shots52, '#b8892a')}
      </div>`;
  }

  return `
  <div style="padding:24px 0 16px">
    <button class="btn-ghost btn-muted" onclick="goTab('history')" style="padding:0;font-size:12px;margin-bottom:16px">← Back to History</button>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
      <div class="score-ring" style="width:72px;height:72px;margin:0;flex-shrink:0">
        <div class="score-ring-val" style="font-size:24px">${g.total}</div>
        <div class="score-ring-max">/ ${g.maxPossible}</div>
      </div>
      <div>
        <div style="margin-bottom:4px">
          <span class="game-type-badge ${isNine?'gtb-nine':'gtb-ladder'}">${isNine?'9-Hole':'Club Ladder'}</span>
        </div>
        <div style="font-size:15px;font-weight:600;color:#1a5c34">${grade} &nbsp;<span style="color:#8aaa90;font-weight:400;font-size:12px">${pct}%</span></div>
        <div style="font-size:11px;color:#8aaa90;margin-top:2px">${fmtDate(g.date)}</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="section-label">By Shot Type</div>
    ${summaryHTML}
  </div>

  <div class="card">
    ${detailHTML}
  </div>

  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn-ghost flex-1" onclick="goTab('history')" style="margin-top:0">← History</button>
    <button class="btn flex-1" onclick="${isNine?'startNineHole()':'startLadder()'}" style="margin-top:0">Play Again</button>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — PLANS
// ─────────────────────────────────────────────────────────────────────────────
function renderPlans() {
  const recent = sessions.slice(-5).reverse();
  const recentHTML = recent.length ? `
    <div class="section-label" style="margin-top:28px">Recent Sessions</div>
    ${recent.map(s => `
      <div class="card">
        <div class="row-between" style="align-items:center">
          <div>
            <div class="serif" style="font-size:13px;color:#1a2e22">${s.planName}</div>
            <div style="font-size:10px;color:#8aaa90;margin-top:2px">${fmtDate(s.date)} · ${s.drillCount} drills${s.skipped?` · ${s.skipped} skipped`:''}</div>
          </div>
          <div class="row wrap gap-7" style="justify-content:flex-end;max-width:160px">
            ${s.highlights.slice(0,2).map(h=>`<span style="background:#e8f2eb;border:1px solid #b0d4bc;border-radius:5px;padding:2px 7px;font-size:10px;color:#1a5c34">${h}</span>`).join('')}
          </div>
        </div>
      </div>`).join('')}` : '';

  return `
  <div class="page-header">
    <div class="page-title">Short Game Grind ⛳</div>
    <div class="page-sub">Pick a plan · Log as you go · Track improvement</div>
  </div>
  <div class="row wrap gap-7" style="margin-bottom:18px">
    <span class="space-badge space-full">⚠ Open green needed</span>
    <span class="space-badge space-edge">◐ Edge only</span>
    <span class="space-badge space-solo">✓ Single hole</span>
  </div>
  <div class="section-label">Session Plans</div>
  ${PLANS.map((plan, i) => {
    const planDrills = plan.drills.map(id=>getDrill(id)).filter(Boolean);
    const maxSpace = planDrills.some(d=>d.spaceNeeded==='full')?'full':planDrills.some(d=>d.spaceNeeded==='edge')?'edge':'solo';
    const sp = SPACE_INFO[maxSpace];
    return `
    <div class="card clickable" onclick="startSession(${i})">
      <div class="row-between" style="margin-bottom:5px">
        <div class="serif" style="font-size:16px;color:#1a2e22">${plan.name}</div>
        <span class="badge" style="font-size:10px">${plan.label}</span>
      </div>
      <div style="font-size:11px;color:#8aaa90;margin-bottom:7px">${planDrills.map(d=>d.name).join(' · ')}</div>
      <span class="space-badge ${sp.cls}" style="font-size:10px;padding:2px 7px">${sp.icon} ${sp.maxLabel}</span>
    </div>`;
  }).join('')}
  ${recentHTML}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — DRILLS
// ─────────────────────────────────────────────────────────────────────────────
function renderDrills() {
  const groups = { solo:[], edge:[], full:[] };
  DRILLS.forEach(d => groups[d.spaceNeeded].push(d));
  const headers = { solo:'✓ Works Anywhere — Single Hole', edge:'◐ Edge of Green Only', full:'⚠ Needs Open Green' };
  const colors  = { solo:'#2e7d4f', edge:'#b8892a', full:'#c0392b' };
  return `
  <div class="page-header">
    <div class="page-title">All Drills</div>
    <div class="page-sub">${DRILLS.length} drills · sorted by space needed</div>
  </div>
  ${['solo','edge','full'].map(space=>`
    <div style="margin-bottom:24px">
      <div class="section-label" style="color:${colors[space]};margin-bottom:12px">${headers[space]}</div>
      ${groups[space].map(d=>`
        <div class="card">
          <div class="row-between" style="margin-bottom:5px">
            <div class="serif" style="font-size:15px;color:#1a2e22">${d.name}</div>
            <div style="font-size:11px;color:#8aaa90">${d.duration} min</div>
          </div>
          <div style="font-size:12px;color:#8aaa90;line-height:1.65;margin-bottom:7px">${d.description}</div>
          <div style="font-size:11px;color:#2e7d4f;line-height:1.55">💡 ${d.tip}</div>
          <div style="font-size:10px;color:#8aaa90;margin-top:7px">Clubs: ${d.clubs.join(', ')}</div>
        </div>`).join('')}
    </div>`).join('')}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — PRACTICE LIBRARY
// ─────────────────────────────────────────────────────────────────────────────
function renderPractice() {
  return `
  <div class="page-header">
    <div class="page-title">Practice Ideas 💡</div>
    <div class="page-sub">Focused drills to do after your game · no scoring needed</div>
  </div>
  ${PRACTICES.map(p => `
    <div class="practice-card">
      <span class="practice-tag ${p.tagCls}">${p.tag}</span>
      <div class="serif" style="font-size:16px;color:#1a2e22;margin-bottom:6px">${p.title}</div>
      <div style="font-size:13px;color:#4a6652;line-height:1.65">${p.desc}</div>
    </div>`).join('')}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — HISTORY
// ─────────────────────────────────────────────────────────────────────────────
function renderHistory() {
  const st = computeStats();
  const nineGs   = [...games].filter(g=>g.type==='nine').reverse();
  const ladderGs = [...games].filter(g=>g.type==='ladder').reverse();

  const gameTiles = [
    { l:'Games Played',  v: st.totalGames },
    { l:'Best 9-Hole',   v: st.bestNine   != null ? st.bestNine+'/18'   : '—' },
    { l:'Avg 9-Hole',    v: st.avgNine    != null ? st.avgNine+'/18'    : '—' },
    { l:'Best Ladder',   v: st.bestLadder != null ? st.bestLadder+'/8'  : '—' },
  ];
  const drillTiles = [
    { l:'Sessions',  v: st.total },
    { l:'Total Time',v: st.totalMins+'m' },
    { l:'Best U&D',  v: st.bestUD   != null ? st.bestUD+'/5'   : '—' },
    { l:'Best Prox', v: st.bestProx != null ? st.bestProx+'ft' : '—' },
  ];

  const nineData   = nineGs.map(g=>g.total);
  const ladderData = ladderGs.map(g=>g.total);
  const sessionList = [...sessions].reverse();

  return `
  <div class="page-header">
    <div class="page-title">Your Progress 📈</div>
    <div class="page-sub">${st.totalGames} games · ${st.total} drill sessions</div>
  </div>
  <div class="io-row">
    <button class="btn-ghost" onclick="exportData()">↓ Export backup</button>
    <button class="btn-ghost" onclick="document.getElementById('import-input').click()">↑ Import / restore</button>
    <input id="import-input" type="file" accept=".json" style="display:none" onchange="handleImport(this)"/>
  </div>
  <div id="import-toast" class="toast"></div>

  <div class="section-label">Game Scores</div>
  <div class="stat-grid">${gameTiles.map(t=>`<div class="stat-tile"><div class="stat-label">${t.l}</div><div class="stat-value">${t.v}</div></div>`).join('')}</div>
  ${nineData.length >= 2 ? renderChart(nineData.slice().reverse(), '9-Hole score (/ 18)', false) : ''}
  ${ladderData.length >= 2 ? renderChart(ladderData.slice().reverse(), 'Ladder score (/ 8)', false) : ''}

  <div class="section-label" style="margin-top:20px">Drill Sessions</div>
  <div class="stat-grid">${drillTiles.map(t=>`<div class="stat-tile"><div class="stat-label">${t.l}</div><div class="stat-value">${t.v}</div></div>`).join('')}</div>
  ${renderChart(sessions.map(s=>s.metrics?.up_downs).filter(v=>v!=null), 'Up-and-downs / 5', false)}
  ${renderChart(sessions.map(s=>Number(s.metrics?.proximity)).filter(n=>n>0&&!isNaN(n)), 'Chipping proximity (ft)', true)}

  ${nineGs.length > 0 ? `
  <div class="section-label" style="margin-top:20px">9-Hole History</div>
  ${nineGs.map(g=>`
    <div class="card clickable" onclick="viewGame('${g.id}')">
      <div class="row-between" style="align-items:center">
        <div>
          <div class="row gap-7" style="margin-bottom:3px">
            <span class="game-type-badge gtb-nine">9-Hole</span>
          </div>
          <div style="font-size:10px;color:#8aaa90">${fmtDate(g.date)}</div>
          <div style="font-size:10px;color:#b0d4bc;margin-top:3px">Tap to see breakdown →</div>
        </div>
        <div style="text-align:right">
          <div class="serif" style="font-size:26px;color:#1a5c34">${g.total}<span style="font-size:11px;color:#8aaa90;font-family:'Source Sans 3',sans-serif"> /18</span></div>
          <div style="font-size:10px;color:#8aaa90">Chip ${g.byType.chip} · Pitch ${g.byType.pitch} · Flop ${g.byType.flop}</div>
        </div>
      </div>
    </div>`).join('')}` : ''}

  ${ladderGs.length > 0 ? `
  <div class="section-label" style="margin-top:20px">Ladder History</div>
  ${ladderGs.map(g=>`
    <div class="card clickable" onclick="viewGame('${g.id}')">
      <div class="row-between" style="align-items:center">
        <div>
          <div class="row gap-7" style="margin-bottom:3px">
            <span class="game-type-badge gtb-ladder">Ladder</span>
          </div>
          <div style="font-size:10px;color:#8aaa90">${fmtDate(g.date)}</div>
          <div style="font-size:10px;color:#b0d4bc;margin-top:3px">Tap to see breakdown →</div>
        </div>
        <div style="text-align:right">
          <div class="serif" style="font-size:26px;color:#b8892a">${g.total}<span style="font-size:11px;color:#8aaa90;font-family:'Source Sans 3',sans-serif"> /8</span></div>
          <div style="font-size:10px;color:#8aaa90">8-iron ${g.by8i}/4 · 52° ${g.by52}/4</div>
        </div>
      </div>
    </div>`).join('')}` : ''}

  ${sessionList.length > 0 ? `
  <div class="section-label" style="margin-top:20px">Drill Sessions</div>
  ${sessionList.map(s=>`
    <div class="card">
      <div class="row-between">
        <div class="serif" style="font-size:13px;color:#1a2e22">${s.planName}</div>
        <div style="font-size:10px;color:#8aaa90">${fmtDate(s.date)}</div>
      </div>
      <div style="font-size:11px;color:#8aaa90;margin-top:3px">${s.highlights.join(' · ')}</div>
    </div>`).join('')}` : ''}

  ${games.length === 0 && sessions.length === 0 ? `
    <div class="center" style="padding:48px 0;color:#8aaa90;font-size:14px">No history yet — play a game or do a drill session!</div>` : ''}

  <button class="btn-ghost btn-muted" style="width:100%;margin-top:16px" onclick="confirmClear()">Clear All History</button>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — SESSION (drill)
// ─────────────────────────────────────────────────────────────────────────────
function renderSession() {
  const drill = state.activeDrills[state.currentIdx];
  const idx = state.currentIdx;
  const total = state.activeDrills.length;

  const dots = state.activeDrills.map((_,i) => {
    const busy=state.skipped[i]==='busy', sk=state.skipped[i]==='skipped';
    const cur=i===idx, done=i<idx&&!state.skipped[i];
    const cls = busy?'dot busy':sk?'dot skip':done?'dot done':cur?'dot active':'dot';
    return `<div class="${cls}" style="width:${cur?22:7}px"></div>`;
  }).join('');

  const clubBtns = (drill.clubs||['52°','56°','60°','8i bump','Putter']).map(c => {
    const sel = state.clubSel[idx]===c;
    return `<button class="btn-ghost club-btn${sel?' selected':''}" onclick="selectClub(${idx},'${c.replace(/'/g,"\\'")}')">${c}</button>`;
  }).join('');

  let metricHTML;
  if (drill.metricType==='counter') {
    const val = state.drillData[idx]?.[drill.metric] ?? 0;
    metricHTML = `
      <div class="row gap-16" style="align-items:center">
        <button class="counter-btn" onclick="adjustCounter(${idx},'${drill.metric}',-1,${drill.metricMax||99})">−</button>
        <div id="counter-display" class="serif" style="font-size:48px;color:#1a5c34;min-width:42px;text-align:center;line-height:1">${val}</div>
        <button class="counter-btn" onclick="adjustCounter(${idx},'${drill.metric}',1,${drill.metricMax||99})">+</button>
        <div style="font-size:11px;color:#8aaa90">/ ${drill.metricMax}</div>
      </div>`;
  } else {
    const unit = drill.id==='ladder'?'pts':drill.id==='three_ball'?'ft ring':'ft';
    const val = state.drillData[idx]?.[drill.metric]||'';
    metricHTML = `
      <div class="row" style="gap:10px;align-items:center">
        <input class="inp" type="number" inputmode="decimal" placeholder="—" style="max-width:120px" value="${val}"
          oninput="setDrillVal(${idx},'${drill.metric}',this.value)"/>
        <div style="font-size:12px;color:#8aaa90">${unit}</div>
      </div>`;
  }

  const notesVal = (state.drillData[idx]?.notes||'').replace(/"/g,'&quot;');
  const backBtn = idx>0 ? `<button class="btn-ghost flex-1" onclick="state.currentIdx--;renderSession()">← Back</button>` : '';
  const skipBtn = `<button class="btn-ghost btn-danger flex-1" onclick="openSkip()">Skip</button>`;
  const nextBtn = idx<total-1
    ? `<button class="btn flex-2 mt-0" onclick="advanceDrill()">Next →</button>`
    : `<button class="btn btn-green flex-2 mt-0" onclick="finishSession()">Finish ✓</button>`;

  document.getElementById('app').innerHTML = `
  <div class="session-header">
    <div class="serif" style="font-size:22px;color:#1a2e22">Session</div>
    <div class="badge" id="session-timer">${fmtTimer(state.timerSecs)}</div>
  </div>
  <div class="row" style="gap:5px;margin-bottom:18px;align-items:center">
    ${dots}
    <div style="font-size:10px;color:#8aaa90;margin-left:5px">${idx+1} / ${total}</div>
  </div>
  <div class="row-between" style="margin-bottom:8px">
    <div class="serif" style="font-size:20px;color:#1a2e22;flex:1;margin-right:10px">${drill.name}</div>
    ${spaceBadgeHTML(drill, true)}
  </div>
  <div style="font-size:12px;color:#8aaa90;line-height:1.7;margin-bottom:16px">${drill.description}</div>
  <div style="margin-bottom:16px">
    <div class="section-label" style="margin-bottom:8px">Club Used</div>
    <div class="row wrap gap-7">${clubBtns}</div>
  </div>
  <div style="margin-bottom:6px">
    <div class="section-label" style="margin-bottom:10px">${drill.metricLabel}</div>
    ${metricHTML}
  </div>
  <textarea class="inp" rows="2" placeholder="Notes (optional)..." style="margin-top:12px;font-size:12px"
    oninput="setDrillVal(${idx},'notes',this.value)">${notesVal}</textarea>
  <div class="tip">💡 ${drill.tip}</div>
  <div class="row gap-8" style="margin-top:18px">${backBtn}${skipBtn}${nextBtn}</div>
  <div class="center" style="margin-top:13px">
    <button class="btn-ghost btn-muted" onclick="abandonSession()">Abandon session</button>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — DRILL DONE
// ─────────────────────────────────────────────────────────────────────────────
function renderDone() {
  const s = state.lastSession;
  return `
  <div style="padding:44px 0 22px;text-align:center">
    <div style="font-size:44px;margin-bottom:10px">⛳</div>
    <div class="serif" style="font-size:26px;color:#1a2e22;margin-bottom:4px">Session Complete</div>
    <div style="font-size:12px;color:#8aaa90">${s.duration||'—'} min · ${s.drillCount} drills${s.skipped?` · ${s.skipped} skipped`:''}</div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="section-label">What you logged</div>
    ${s.highlights.map((h,i)=>`
      <div class="row" style="gap:9px;padding:7px 0;${i<s.highlights.length-1?'border-bottom:1px solid #e8f2eb':''}">
        <div style="width:5px;height:5px;border-radius:50%;background:#1a5c34;flex-shrink:0"></div>
        <div style="font-size:13px;color:#1a2e22">${h}</div>
      </div>`).join('')}
  </div>
  <button class="btn" onclick="goTab('games')">Play a Game →</button>
  <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="goTab('plans')">Back to Plans</button>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// UTILITY
// ─────────────────────────────────────────────────────────────────────────────
function confirmClear() {
  if (confirm('Clear ALL history (games + sessions)? Export a backup first.')) {
    sessions=[]; games=[]; saveSessions(sessions); saveGames(games); render();
  }
}
function handleImport(input) {
  const file = input.files?.[0]; if (!file) return;
  importData(file).then(added => { showToast(`Imported ${added} record${added!==1?'s':''}.`, true); render(); })
    .catch(err => showToast(err.message, false));
  input.value='';
}
function showToast(msg, ok) {
  const el=document.getElementById('import-toast'); if(!el) return;
  el.textContent=msg; el.className=`toast show ${ok?'ok':'err'}`;
  setTimeout(()=>el.classList.remove('show'),4000);
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  updateNavActive();

  // Full-screen game states (no nav)
  if (state.screen === 'game-nine') { showNav(false); renderNineHole(); return; }
  if (state.screen === 'game-ladder') { showNav(false); renderLadderGame(); return; }
  if (state.screen === 'session')   { showNav(false); renderSession();    return; }

  showNav(true);

  let html = '';
  if      (state.screen === 'game-detail')          html = renderGameDetail();
  else if (state.screen === 'game-done')            html = renderGameDone();
  else if (state.screen === 'done')               html = renderDone();
  else if (state.tab    === 'games')              html = renderGames();
  else if (state.tab    === 'plans')              html = renderPlans();
  else if (state.tab    === 'drills')             html = renderDrills();
  else if (state.tab    === 'practice')           html = renderPractice();
  else if (state.tab    === 'history')            html = renderHistory();

  document.getElementById('app').innerHTML = html;
}

render();
</script>
</body>
</html>
